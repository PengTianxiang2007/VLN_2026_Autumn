<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamVLN + Isaac Sim · 实时 JEV</title>
<style>
:root{--ink:#17344e;--muted:#65788a;--line:#d9e2eb;--paper:#fff;--bg:#edf2f6;--blue:#2563eb;--teal:#13845c;--red:#b33a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
header{background:linear-gradient(115deg,#17344e,#1d5a68);color:#fff;padding:22px 26px}.headerRow{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}header h1{margin:0 0 5px;font-size:24px}.sub{font-size:12px;opacity:.82}
.layout{display:grid;grid-template-columns:245px minmax(650px,1fr) 390px;gap:14px;padding:14px 16px 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;min-width:0}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 7px}p{margin:7px 0}.muted{color:var(--muted);font-size:12px}
button,select,input,textarea{font:inherit}button,select{border:1px solid #c5d2de;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink)}button{cursor:pointer}button:hover,button.active{background:#e6f0fb;border-color:#4f8dcc}
#filters{width:100%}#cases{max-height:650px;overflow:auto}#cases button{display:block;width:100%;text-align:left;white-space:pre-line;margin:7px 0;font-size:12px}#cases button span{display:block;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:14px 16px 0}.metric,.notice{background:#fff;border:1px solid var(--line);border-radius:10px}.metric{padding:11px 14px}.metric strong{display:block;font-size:24px;font-variant-numeric:tabular-nums}.metric span{font-size:12px;color:var(--muted)}.notice{margin:12px 16px;padding:10px 14px;border-left:4px solid #c58317}
.mapGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mapTitle{font-weight:700;margin:0 0 5px}.evidenceMap{display:block;width:100%;height:430px;background:#f3f6f9;border-radius:7px}.playback{margin:9px 0}input[type=range]{width:100%;accent-color:var(--blue)}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}.swatch{display:inline-block;width:26px;height:5px;margin-right:5px;vertical-align:middle}
#scorePlot{display:block;width:100%;height:230px;background:#fff}.filterBox{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0;background:#f8fafc}.filterOptions{display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center;font-size:12px}.filterLegend{display:flex;flex-wrap:wrap;gap:5px 13px;font-size:11px;margin-top:6px}.filterLegend i{display:inline-block;width:23px;height:4px;margin-right:4px;vertical-align:middle}
#rgb{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#122432;border-radius:7px}.values{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 0}.value{border:1px solid var(--line);border-radius:7px;padding:8px}.value b{display:block;font-size:18px}.value span{font-size:11px;color:var(--muted)}#history{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#history button{padding:3px;font-size:11px}#history img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}pre{white-space:pre-wrap;word-break:break-word;background:#f3f6fa;padding:10px;border-radius:6px;max-height:280px;overflow:auto;font:12px/1.55 ui-monospace,monospace}details{margin:10px 0}summary{cursor:pointer;font-weight:700}textarea{width:100%;min-height:70px;border:1px solid #c5d2de;border-radius:6px;padding:8px}.footer{padding:0 18px 20px;color:var(--muted);font-size:12px}.instruction{border:1px solid var(--line);border-radius:7px;padding:9px;background:#f8fafc;font-size:12px}
@media(max-width:1250px){.layout{grid-template-columns:230px 1fr}.layout>aside:last-child{grid-column:2}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.layout{display:block}.panel{margin-bottom:12px}.mapGrid{grid-template-columns:1fr}.evidenceMap{height:340px}.stats{grid-template-columns:repeat(2,1fr)}header{padding:18px}h1{font-size:20px}.values{grid-template-columns:1fr}}
</style></head><body>
<header><div class="headerRow"><div><h1 id="title">StreamVLN + Isaac Sim · 实时 JEV</h1><div class="sub" id="runInfo"></div></div><select id="language"><option value="zh">中文</option><option value="en">English</option></select></div></header>
<div class="stats" id="stats"></div>
<div class="notice" id="notice"></div>
<main class="layout">
<aside class="panel"><h2 data-i18n="cases"></h2><select id="filters"><option value="all" data-i18n="all"></option><option value="success" data-i18n="success"></option><option value="failure" data-i18n="failure"></option></select><div id="cases"></div><button id="export" data-i18n="export"></button><p class="muted" data-i18n="caseHint"></p></aside>
<section class="panel"><h2 id="episodeTitle"></h2><p id="caseStats"></p>
<div class="mapGrid">
<div><p class="mapTitle" data-i18n="rawMap"></p><canvas class="evidenceMap" id="rawMap"></canvas><div class="legend"><span><i class="swatch" style="background:#f4d9c7"></i>0</span><span><i class="swatch" style="background:#c37f72"></i>.5</span><span><i class="swatch" style="background:#8b1d1d"></i>1</span></div></div>
<div><p class="mapTitle" data-i18n="streamMap"></p><canvas class="evidenceMap" id="streamMap"></canvas><div class="legend"><span><i class="swatch" style="background:#ccebe7"></i>0</span><span><i class="swatch" style="background:#3fa8a4"></i>.5</span><span><i class="swatch" style="background:#075f66"></i>1</span></div></div>
</div>
<div class="playback"><label for="frame" data-i18n="mapProgress"></label><input id="frame" type="range" min="0" value="0"><div id="step"></div></div>
<div class="controls"><button id="prev" data-i18n="prev"></button><button id="play" data-i18n="play"></button><button id="next" data-i18n="next"></button><label><input id="reference" type="checkbox"> <span data-i18n="reference"></span></label><label><input id="full" type="checkbox" checked> <span data-i18n="full"></span></label><label><input id="showSampleMapPoints" type="checkbox"> <span data-i18n="showSampleMapPoints"></span></label></div>
<div class="filterBox"><div class="filterOptions"><strong data-i18n="plotTitle"></strong><label><input id="showRawLine" type="checkbox" checked> <span data-i18n="rawLine"></span></label><label><input id="showStreamLine" type="checkbox" checked> <span data-i18n="streamLine"></span></label><span class="muted" data-i18n="fixedFilter"></span></div><div class="filterLegend"><span><i style="background:#b33a3a"></i><span data-i18n="rawLine"></span></span><span><i style="background:#0793ad"></i><span data-i18n="streamLine"></span></span></div><p class="muted" id="sampleSummary"></p></div>
<canvas id="scorePlot"></canvas>
<details><summary data-i18n="prompt"></summary><h3>English · actual model input</h3><pre id="promptEnglish"></pre><h3>中文翻译</h3><pre id="promptChinese"></pre></details>
</section>
<aside class="panel"><h2 data-i18n="current"></h2><img id="rgb" alt="current RGB"><div class="playback"><label for="imageFrame" data-i18n="imageProgress"></label><input id="imageFrame" type="range" min="0" value="0"><div id="imageStep"></div></div><div class="values"><div class="value"><b id="probValue"></b><span data-i18n="probability"></span></div><div class="value"><b id="latencyValue"></b><span data-i18n="latency"></span></div><div class="value"><b id="lagValue"></b><span data-i18n="lag"></span></div></div><p class="muted" id="inputInfo"></p><div id="history"></div><div class="instruction" id="instruction"></div><h3 data-i18n="rawResult"></h3><pre id="raw"></pre>
<h3 data-i18n="review"></h3><select id="category"><option value="likely" data-i18n="likely"></option><option value="uncertain" data-i18n="uncertain"></option><option value="unlikely" data-i18n="unlikely"></option></select><textarea id="note" data-i18n="notePlaceholder"></textarea><p class="muted" data-i18n="noteHint"></p></aside>
</main><div class="footer" id="footer"></div>
<script id="payload" type="application/json">__DATA__</script><script>__SCRIPT__</script></body></html>
