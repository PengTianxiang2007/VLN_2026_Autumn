<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossing 人工数据集 v001</title>
<style>
@font-face{font-family:ReviewChinese;src:url('__FONT__') format('truetype');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182a40;font:15px/1.5 ReviewChinese,system-ui,sans-serif}main{max-width:1700px;margin:auto;padding:24px 28px}h1{font-size:25px;margin:0}h2{font-size:16px;margin:0}p{margin:7px 0}button,select,input{font:inherit}button,select{border:1px solid #dce3ec;background:white;border-radius:8px;padding:7px 12px;color:inherit}button{cursor:pointer}button:hover{background:#edf3ff}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9fc3ff}.muted{color:#64748b}.small{font-size:12px}.stats,.toolbar,.head,.transport,.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{margin:10px 0 18px}.pill{background:#e6ecf3;border-radius:20px;padding:3px 11px;font-size:12px}.toolbar{margin-bottom:12px}#case-select{flex:1;min-width:230px}.card{border:1px solid #dce3ec;border-radius:12px;background:white;overflow:hidden}.instruction{padding:12px 16px;margin-bottom:14px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}.head{padding:10px 14px;justify-content:space-between;border-bottom:1px solid #dce3ec;min-height:48px}.visual{aspect-ratio:4/3;position:relative;background:#e9eef4}.visual img,.visual canvas{width:100%;height:100%;display:block;object-fit:contain}.visual canvas{touch-action:none;cursor:grab}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#e9eef4df}.loading[hidden]{display:none}.timeline{padding:10px 14px}.timeline input{width:100%;accent-color:#2166db}.caption{display:flex;justify-content:space-between;font-size:12px;color:#64748b}.legend{padding:0 14px 11px;font-size:12px;gap:12px}.legend span:before{content:'';width:14px;height:3px;background:var(--color);display:inline-block;margin-right:5px;vertical-align:middle}.legend .dot:before{width:8px;height:8px;border-radius:50%}.transport{justify-content:center;margin:12px 0}.transport input{width:80px;border:1px solid #dce3ec;border-radius:7px;padding:6px}.events{padding:12px;display:flex;flex-wrap:wrap;gap:8px}.event{border-left:4px solid #2166db;text-align:left;font-size:13px}.event.wrong{border-left-color:#d75a13}.event.active{background:#eaf2ff;outline:2px solid #9bbdf0}.head button{padding:3px 9px}footer{font-size:12px;color:#64748b;margin-top:16px}#notice{color:#64748b;font-size:13px;margin:10px 0}
@media(max-width:700px){main{padding:12px}.views{grid-template-columns:1fr}.toolbar{gap:6px}#case-select{order:3;width:100%}.transport{gap:5px}.transport button{padding:6px 8px}}
</style></head><body><main>
<div class="small muted">HUMAN ANNOTATIONS · SEED 2 · v001</div><h1>Crossing 离线数据集</h1><div id="stats" class="stats"></div>
<div class="toolbar"><button id="prev-case">← 上一条</button><select id="filter" aria-label="筛选任务"><option value="all">全部任务</option><option value="failure">失败任务</option><option value="success">成功任务</option><option value="wrong">含错误选择标注</option></select><select id="case-select" aria-label="选择任务"></select><button id="next-case">下一条 →</button></div>
<section class="card instruction"><div id="case-meta" class="small muted"></div><p id="instruction"></p><details class="small muted"><summary>英文原文</summary><p id="english"></p></details></section>
<div class="views"><section class="card"><div class="head"><h2>第一人称观测</h2><span id="frame-status" class="small"></span></div><div class="visual"><img id="rgb" alt="当前帧的第一人称观测"><div id="loading" class="loading">正在载入画面…</div></div><div class="timeline"><input type="range" id="rgb-slider" min="0" value="0" step="1" aria-label="观测进度"><div class="caption"><span id="rgb-caption"></span><span class="last-frame"></span></div></div><div class="legend"><span class="muted">标注来自用户提交；点击下方标注可跳转。</span></div></section>
<section class="card"><div class="head"><h2>俯视地图</h2><div><button id="zoom-out">−</button><button id="zoom-reset">全图</button><button id="zoom-in">＋</button></div></div><div class="visual"><canvas id="map" width="960" height="720" aria-label="路线与人工Crossing标注"></canvas></div><div class="timeline"><input type="range" id="map-slider" min="0" value="0" step="1" aria-label="地图进度"><div class="caption"><span id="map-caption"></span><span class="last-frame"></span></div></div><div class="legend"><span style="--color:#178064">正确参考路线</span><span style="--color:#3b6da4">实际路线</span><span class="dot" style="--color:#7441c6">当前位置</span><span class="dot" style="--color:#2166db">Crossing</span><span class="dot" style="--color:#d75a13">错误选择</span></div></section></div>
<div class="transport"><button id="prev-frame">← 上一帧</button><button id="play">▶ 播放</button><button id="next-frame">下一帧 →</button><select id="speed" aria-label="播放速度"><option value="2">2 帧/秒</option><option value="6" selected>6 帧/秒</option><option value="12">12 帧/秒</option></select><label for="frame-input">跳到帧</label><input id="frame-input" type="number" min="0" value="0"><button id="jump-frame">跳转</button></div>
<section class="card"><div class="head"><h2>本条人工标注</h2><span id="event-summary" class="small muted"></span></div><div id="events" class="events"></div></section>
<p id="notice">此版本只读。未标帧未自动当作负样本；错误选择标注同时属于 Crossing。</p><footer id="footer"></footer>
</main><script id="data" type="application/json">__DATA__</script><div id="media" hidden>__MEDIA__</div><script>__SCRIPT__</script></body></html>
