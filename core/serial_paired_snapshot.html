<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线导航恢复 · 配对回放</title>
<style>
@font-face{font-family:Review;src:url(replay.ttf)}*{box-sizing:border-box}body{margin:0;background:#f4f4ee;color:#20332d;font:15px/1.55 Inter,Review,system-ui,sans-serif}main{max-width:1430px;margin:auto;padding:22px clamp(16px,4vw,60px) 55px}header,.line,.controls,.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;border-bottom:2px solid #224238;padding-bottom:16px}h1,h2,h3,p{margin:0}h1{font-size:clamp(24px,3.3vw,46px);letter-spacing:-.045em}h2{font-size:21px}h3{font-size:17px}small,.muted,.hint{color:#4e625b}.hint{font-size:13px}a{color:#075e56}button,select,input{font:inherit}button,select,.download{background:#fff;border:1px solid #a9b8ad;border-radius:6px;padding:5px 9px;color:#213e34;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #c47e20}button:disabled{cursor:default;opacity:.45}button[aria-pressed=true],button.selected{background:#214c40;color:white;border-color:#214c40}.top{display:grid;grid-template-columns:1.2fr 1fr;gap:25px;margin:20px 0}.card,.case{background:#fffefa;border:1px solid #cfd7ce;border-radius:10px;padding:16px}.overview{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.overview td,.overview th{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid #e3e9e1}.overview th:first-child,.overview td:first-child{text-align:left}.overview tbody tr:first-child{font-weight:700;color:#126452}.summary{display:flex;flex-direction:column;justify-content:center;gap:6px}.summary strong{font-size:25px}.toolbar{border-block:1px solid #b8c5ba;padding:12px 0;margin-bottom:14px}.case{padding:clamp(14px,2.6vw,30px)}.case-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}#instruction{margin:9px 0 18px;max-width:105ch;line-height:1.7}#case-title{font-family:ui-monospace,monospace}.players{display:grid;grid-template-columns:1fr 1fr;gap:20px}.arm{min-width:0;border-top:3px solid #167863;padding-top:8px}.arm.original{border-color:#426cab}.frame{display:block;width:100%;aspect-ratio:4/3;background:#dde3df;border-radius:6px}.arm .controls{gap:6px;margin:5px 0}.controls input{min-width:75px;flex:1;accent-color:#13775c}.original input{accent-color:#426cab}.stamp{font:13px ui-monospace,monospace}.metrics{font-size:14px;margin:3px 0 8px}.analysis{display:grid;grid-template-columns:.95fr 1.05fr;gap:20px;margin-top:20px}.box{min-width:0;border-top:1px solid #cfd7ce;padding-top:12px}.legend{gap:8px 15px;font-size:12px;color:#46584e;margin:5px 0}.swatch{display:inline-block;width:15px;border-top:3px solid;margin-right:4px;vertical-align:middle}#map{display:block;width:100%;height:310px;background:#eef1eb;border-radius:5px}#wave{display:block;width:100%;height:72px;background:#f4f7f2;border-radius:5px}.event-list{max-height:190px;overflow:auto;display:flex;gap:5px;align-content:flex-start;flex-wrap:wrap;padding:6px 0}.event-list button{font-size:12px}.detail{min-height:78px;background:#f0f4ee;padding:10px;border-radius:6px;margin-top:5px;overflow-wrap:anywhere}.detail p{margin:.4em 0;white-space:pre-line}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.views img{width:100%;display:block}.views figure{margin:0}.views figcaption{font-size:12px}.download{display:inline-block;text-decoration:none}.events-head{justify-content:space-between}.skip{margin:18px 0}.skip ul{margin:8px 0}.num{font-variant-numeric:tabular-nums}.wave-head{margin-top:10px}.top .card{overflow:auto}
@media(max-width:820px){.top,.analysis,.players{grid-template-columns:1fr}.top{gap:10px}.players{gap:14px}.top .card{padding:10px}#map{height:260px}}
.toolbar label,.toolbar select{max-width:100%}.map-layers{display:flex;flex-wrap:wrap;gap:5px 8px;border:0;margin:8px 0;padding:0}.map-layers label{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid #cbd4cc;border-radius:5px;font-size:13px;cursor:pointer;background:#fff}.map-layers label:has(input:not(:checked)){opacity:.7}.map-layers input{accent-color:#305e4f;margin:0}.map-layers i{display:inline-block;width:13px;height:0;border-top:3px solid var(--ink)}.map-layers i.dashed{border-top-style:dashed}.map-layers i.circle{width:9px;height:9px;border:2px solid var(--ink);border-radius:50%}.map-layers legend{font-size:13px;color:#4e625b}.map-timeline input{width:100px}.map-note{margin:4px 0 8px}.annotation{cursor:pointer}
</style></head>
<body><main>
<header><div><h1 id="title"></h1><small id="stamp"></small></div><div class="line"><button id="zh">中文</button><button id="en">English</button><a id="csv" class="download" href="paired_results.zip" download></a><a id="offline" class="download" href="replay_offline.zip" download></a></div></header>
<section class="top"><div class="card"><table class="overview"><thead id="metric-head"></thead><tbody id="summary-table"></tbody></table></div><div class="summary"><strong id="coverage"></strong><p id="changes"></p><p id="recovery-totals" class="hint"></p></div></section>
<nav class="toolbar line"><label><span id="filter-label"></span> <select id="filter"></select></label><label><span id="case-label"></span> <select id="case"></select></label><button id="prev-case">←</button><button id="next-case">→</button><small id="matches"></small></nav>
<section class="case"><div class="case-head"><h2 id="case-title"></h2><span id="case-outcome"></span></div><p id="instruction"></p><div class="players" id="players"></div><small id="independent" class="hint"></small>
<div class="analysis"><section class="box"><h3 id="map-title"></h3><fieldset class="map-layers" id="layers"><legend id="layers-title"></legend></fieldset><p class="hint map-note" id="map-note"></p><svg id="map" role="img"></svg><div class="controls map-timeline"><label for="map-seek" id="map-seek-label"></label><input id="map-seek" type="range" min="0" step="1"><span id="map-frame" class="stamp"></span></div><div class="line wave-head"><h3 id="wave-title"></h3><small id="wave-hint" class="hint"></small></div><svg id="wave" viewBox="0 0 600 70" preserveAspectRatio="none" role="img"></svg></section>
<section class="box"><div class="line events-head"><h3 id="event-title"></h3><select id="event-filter"></select></div><div id="events" class="event-list"></div><div id="detail" class="detail"></div></section></div></section>
<details class="skip"><summary id="skip-title"></summary><ul id="skips"></ul></details></main>
<script src="data.js"></script><script src="player.js"></script></body></html>
