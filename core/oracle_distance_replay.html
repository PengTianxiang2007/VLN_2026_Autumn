<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle轨迹回放 / Oracle replay</title>
<style>
:root{--ink:#183044;--muted:#657889;--border:#dce4e9;--bg:#f0f4f6;--blue:#2374d5;--green:#12846a;--orange:#d0642b;--purple:#8848c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}h1,h2,h3,p{margin:0}button,select,input{font:inherit}button,select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:#eaf2fa}button.active,button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #92bff0}header{background:#163647;color:white;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px}header p{color:#bed2dc;font-size:13px}h1{font-size:25px;font-weight:650}header label{display:flex;gap:8px;align-items:center;white-space:nowrap}.wrap{max-width:1900px;padding:20px;margin:auto}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.stat,.panel{background:white;border:1px solid var(--border);border-radius:10px}.stat{padding:12px 16px;border-top:3px solid var(--green)}.stat small{display:block;color:var(--muted)}.stat b{font-size:25px;font-weight:650}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar .right{margin-left:auto}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px}aside{align-self:start;position:sticky;top:10px;max-height:88vh;overflow:auto;padding:8px}.case{width:100%;text-align:left;display:block;margin:3px 0;padding:9px;border:1px solid transparent;font-size:12px}.case.selected{border-color:#a9c7e9;background:#edf5ff;box-shadow:inset 3px 0 var(--blue)}.case small{display:block;color:var(--muted)}.badge{padding:2px 6px;border-radius:4px;display:inline-block;font-size:11px;background:#edf2f6}.good{color:#087151;background:#e0f3ea}.bad{color:#b44a3b;background:#fbeae5}.task{padding:14px 18px;margin-bottom:12px}.task h2{font-size:18px}.instruction{margin:7px 0;color:#365267}.meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}main{min-width:0}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.view{padding:12px;min-width:0}.view h3{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}.stage{height:clamp(260px,29vw,460px);background:#f6f7f8;border:1px solid #e7ecef;border-radius:7px;overflow:hidden;position:relative}.stage svg{width:100%;height:100%;touch-action:none}.stage img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;background:#10222e}.timeline{width:100%;accent-color:var(--blue);cursor:pointer;margin:10px 0 0}.clock{font-size:12px;color:var(--muted);min-height:22px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:8px 0}.swatch{display:inline-block;width:18px;border-top:3px solid currentColor;vertical-align:middle;margin-right:4px}.dot{display:inline-block;width:8px;height:8px;background:currentColor;border-radius:50%;margin-right:4px}.help{font-size:12px;color:var(--muted);margin:6px 0}.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.control-panel{padding:12px 15px;margin:12px 0}.event-list{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.event-list button{font-size:12px}.event-panel{padding:15px;margin-top:12px}.event-panel h3{font-size:15px}.event-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.event-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#122530;border-radius:7px;cursor:zoom-in}.event-grid figcaption{font-size:12px;margin-bottom:6px}.event-grid figure{margin:0}.facts{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;font-size:12px}.note{padding:12px 15px;margin:12px 0;border-left:3px solid #c3933c;background:#fff7e7;color:#6e5526;border-radius:4px;font-size:12px}.protocol{padding:15px;margin-top:12px}.protocol p{margin-top:8px;color:var(--muted);font-size:12px}.hidden{display:none!important}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:10px;border-bottom:1px solid var(--border);text-align:left}th{background:#f4f7fa;position:sticky;top:0}tr[data-case]{cursor:pointer}tr[data-case]:hover{background:#f0f7ff}.table-wrap{overflow:auto;max-height:75vh}.mono{font-family:ui-monospace,monospace;font-size:11px;overflow-wrap:anywhere}dialog{border:0;border-radius:10px;max-width:94vw;max-height:94vh;padding:12px}dialog::backdrop{background:#10202dcc}dialog img{max-width:88vw;max-height:80vh;display:block;margin:8px auto}#loading{padding:40px;text-align:center}svg text{font-family:system-ui,sans-serif;paint-order:stroke;stroke:white;stroke-width:2.4px;stroke-linejoin:round}#search{min-width:100px;width:170px;border:1px solid var(--border);border-radius:6px;padding:6px 9px}.maptools{display:flex;gap:4px}.maptools button{font-size:11px;padding:3px 7px}.source-label{font-weight:600;color:var(--blue)}.wide-note{margin-top:8px}.tickline{height:5px;position:relative;margin:4px 0}.tick{position:absolute;width:3px;height:5px;background:var(--purple)}
@media(max-width:1000px){.layout{grid-template-columns:170px minmax(0,1fr)}.views{grid-template-columns:1fr}.stage{height:360px}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:22px}}
@media(max-width:650px){header{padding:16px;align-items:flex-start;flex-direction:column}h1{font-size:21px}.wrap{padding:10px}.stats{grid-template-columns:repeat(3,1fr)}.layout{display:block}aside{position:static;max-height:180px;display:grid;grid-template-columns:1fr 1fr;margin-bottom:12px}.case{margin:1px}.views,.event-grid{grid-template-columns:1fr}.stage{height:310px}.toolbar .right{margin-left:0}.task{padding:12px}.meta{gap:6px}.controls{gap:5px}button,select{padding:6px 8px}}
</style></head><body>
<header><div><h1 data-i="title"></h1><p data-i="subtitle"></p></div><label>中文 / English <select id="language"><option value="zh">中文</option><option value="en">English</option></select></label></header>
<div id="loading">正在读取回放数据 / Loading replay…</div><div class="wrap">
<section class="stats" id="stats"></section>
<div class="toolbar"><button id="tab-replay" class="active" data-i="replay"></button><button id="tab-results" data-i="results"></button><select id="filter"><option value="all" data-i="all"></option><option value="success" data-i="successful"></option><option value="failure" data-i="failed"></option><option value="triggered" data-i="triggeredOnly"></option><option value="none" data-i="untriggeredOnly"></option><option value="special" data-i="specialOnly"></option></select><input id="search" aria-label="Task ID" placeholder="ID / scene"><button id="export" class="right" data-i="export"></button></div>
<div id="replay-view" class="layout"><aside id="cases" class="panel"></aside><main>
<section class="panel task"><h2 id="task-title"></h2><p id="instruction" class="instruction"></p><div id="task-meta" class="meta"></div><p id="pair-note" class="note hidden"></p><p id="review-note" class="help hidden"></p><p id="special-note" class="note hidden"></p></section>
<section class="panel control-panel"><div class="controls"><span data-i="source"></span><select id="source"><option value="oracle" data-i="oracle"></option><option value="original" data-i="original"></option></select><button id="start" data-i="start"></button><button id="prev" data-i="prev"></button><button id="play" class="primary"></button><button id="next" data-i="next"></button><button id="end" data-i="end"></button><select id="speed"><option value="500" data-i="slow"></option><option value="180" data-i="normal"></option><option value="70" data-i="fast"></option></select></div><p class="help" data-i="timelineHelp"></p></section>
<div class="views">
<section class="panel view"><h3><span data-i="map"></span><span class="maptools"><button id="zoom-in">＋</button><button id="zoom-out">−</button><button id="fit" data-i="fit"></button><button id="scene" data-i="wholeScene"></button></span></h3><div class="stage"><svg id="map" aria-label="Trajectory map"></svg></div><input id="map-timeline" class="timeline" type="range" min="0" value="0" step="1" aria-label="Map timeline"><div id="map-ticks" class="tickline"></div><div id="map-clock" class="clock"></div><div id="legend" class="legend"></div><p class="help" data-i="mapHelp"></p></section>
<section class="panel view"><h3><span data-i="rgb"></span><span id="source-label" class="source-label"></span></h3><div class="stage"><img id="rgb" alt="RGB"><div id="missing-rgb" class="hidden" style="height:100%;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--muted)"></div></div><input id="rgb-timeline" class="timeline" type="range" min="0" value="0" step="1" aria-label="RGB timeline"><div id="rgb-ticks" class="tickline"></div><div id="rgb-clock" class="clock"></div><div id="node-meta" class="facts"></div><p id="rgb-note" class="help"></p></section>
</div>
<section class="panel event-panel"><h3 data-i="corrections"></h3><div id="events" class="event-list"></div><p id="no-event" class="help hidden" data-i="noEvent"></p><div id="event-detail"><div class="controls"><button id="before" data-i="jumpBefore"></button><button id="after" data-i="jumpAfter"></button><b id="event-heading"></b></div><div id="event-facts" class="facts"></div><div class="event-grid"><figure><figcaption id="before-caption"></figcaption><img id="before-rgb" alt="Before / 纠正前"></figure><figure><figcaption id="after-caption"></figcaption><img id="after-rgb" alt="After / 纠正后"></figure></div><p id="near-note" class="note hidden" data-i="nearNote"></p><details><summary data-i="memory"></summary><p id="memory" class="mono"></p></details></div></section>
<section class="panel protocol"><details><summary data-i="scope"></summary><p data-i="scope1"></p><p data-i="scope2"></p><p data-i="scope3"></p><p data-i="scope4"></p><p id="provenance" class="mono"></p></details></section>
</main></div>
<section id="results-view" class="panel hidden"><div class="table-wrap"><table id="results-table"></table></div><p class="note" data-i="scoreNote"></p></section>
</div><dialog id="dialog"><button id="close" data-i="close"></button><img id="large" alt="RGB"></dialog>
<script id="replay-data" type="application/json">__PAYLOAD__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('replay-data').textContent),$=id=>document.getElementById(id);
const I={
title:['自动 Oracle · 0.75 米纠正组','Automatic Oracle · 0.75 m correction'],subtitle:['VLNVerse R2R 风格任务 · StreamVLN · seed 2 · 33 条真实仿真','VLNVerse R2R-style tasks · StreamVLN · seed 2 · 33 simulated episodes'],
replay:['轨迹回放','Replay'],results:['逐条结果','Results'],all:['全部任务','All tasks'],successful:['官方成功','Official success'],failed:['官方失败','Official failure'],triggeredOnly:['触发纠正','With correction'],untriggeredOnly:['未触发纠正','Without correction'],specialOnly:['成功但非正常停止','Success with abnormal termination'],export:['下载结果 CSV','Download CSV'],
source:['回放来源','Playback source'],oracle:['本次 Oracle 仿真','Current Oracle simulation'],original:['原始未干预轨迹（历史 seed 2）','Original unassisted run (historical seed 2)'],start:['起点','Start'],prev:['← 前一帧','← Previous'],next:['后一帧 →','Next →'],end:['终点','End'],play:['▶ 播放','▶ Play'],pause:['Ⅱ 暂停','Ⅱ Pause'],slow:['慢速','Slow'],normal:['标准','Normal'],fast:['快速','Fast'],
timelineHelp:['地图与 RGB 下方两条进度条同步；切换回放来源可独立查看历史原始轨迹。播放速度仅用于浏览，不代表仿真时间。','The map and RGB sliders are synchronized. Switch the source to inspect the historical run independently. Playback speed is for viewing, not simulation time.'],
map:['场景底图与轨迹','Floor plan and trajectories'],rgb:['第一视角 RGB','First-person RGB'],fit:['路线范围','Fit routes'],wholeScene:['完整场景','Full scene'],reference:['参考正确轨迹','Correct reference route'],originalShort:['原始未干预轨迹','Original unassisted trajectory'],oracleShort:['本次 Oracle 轨迹','Current Oracle trajectory'],teleport:['瞬移（不是步行）','Teleport (not walking)'],crossing:['标注分叉点 C','Annotated fork C'],landing:['计划落点 T','Planned landing T'],goal:['目标 G','Goal G'],radius:['3米目标半径','3 m goal radius'],current:['当前位置 P','Current position P'],
mapHelp:['S 起点 · G 目标 · C 标注分叉点 · T 计划落点 · P 当前位置。实线表示导航，紫色虚线箭头表示瞬移。浅蓝色为完整本次轨迹，深蓝色为已回放部分。拖动地图平移，滚轮缩放。','S: start · G: goal · C: annotated fork · T: planned landing · P: current position. Solid lines show navigation; purple dashed arrows show teleports. Pale blue shows the full current run; dark blue shows the played portion. Drag to pan and scroll to zoom.'],
corrections:['自动纠正事件','Automatic corrections'],noEvent:['本任务未触发纠正，保留自然终止结果。','No correction was triggered; the natural terminal result is retained.'],jumpBefore:['跳到纠正前','Jump before'],jumpAfter:['跳到纠正后','Jump after'],memory:['策略记忆一致性证据','Policy memory equality evidence'],nearNote:['该次实际落点的水平位置已在目标3米半径内，成功不能全部归因于纠正后的自主导航。','This settled landing is horizontally within 3 m of the goal. Success cannot be attributed entirely to autonomous navigation after correction.'],
scope:['实验口径与来源','Protocol and provenance'],scope1:['以当前位置到完整正确参考折线的最短水平距离检测偏航。阈值为0.75米；等待模型动作队列执行完毕后纠正，因此实际触发距离可能更大。落点为关联人工分叉点投影到参考路线后沿路线前移0.75米的位置，同时纠正朝向，保留策略记忆，允许多次纠正。','Deviation is the shortest horizontal distance from the current position to the full correct reference polyline. The threshold is 0.75 m. Correction waits for the policy action queue to empty, so the actual trigger distance may be larger. The landing is 0.75 m along the reference from the projection of the associated annotated fork. Position and heading are corrected while preserving policy memory; repeated corrections are allowed.'],
scope2:['历史原始轨迹来自建立人工样本集时保存的 seed 2 未干预运行；本次是独立物理仿真，不共享逐帧前缀。两次运行不能按相同帧号同步，也不能仅凭本页成功率推断净恢复收益。','The original trajectory comes from the recorded unassisted seed 2 run used to build the annotated dataset. The current run is an independent physical simulation without a shared frame-by-frame prefix. Equal frame indices are not synchronized across runs, and the success rate alone does not establish a net recovery benefit.'],
scope3:['官方成功沿用原版终点距离小于3米的评分，实际终止原因另外显示。地图为既有场景几何投影。纠正前后均用实际记录；没有新的终止画面时会明确标注复用。','Official success follows the original final-distance-below-3-m rule; the termination reason is displayed separately. Floor plans are existing scene geometry projections. Before/after images use actual records; reused terminal images are explicitly labeled.'],
scope4:['33条任务对应34个人工错误选择事件；93次实际纠正并不等于93个独立样本。结果来自运行02的17条、03的3条、05的13条，按各自已完成结果保留；本页只读取已有产物。','The 33 tasks contain 34 annotated wrong-choice events. The 93 actual corrections are not 93 independent samples. Results retain 17 completed episodes from run02, 3 from run03 and 13 from run05. This page only reads existing artifacts.'],
scoreNote:['官方成功与正常成功停止分别显示。各任务均来自选定的历史错误样本，不代表完整 benchmark 成绩。','Official success and normal successful termination are shown separately. Tasks are selected historical error cases, not a complete benchmark.'],
close:['关闭','Close'],tasks:['完成任务','Completed tasks'],official:['官方成功率','Official success rate'],normalSuccess:['正常成功停止','Normal successful stops'],triggered:['触发纠正任务','Tasks with correction'],count:['瞬移纠正次数','Teleports'],annotations:['标注事件','Annotated events'],
success:['成功','Success'],failure:['失败','Failure'],termination:['终止原因','Termination'],successEnd:['正常成功停止','Successful stop'],stuck:['卡住','Stuck'],fall:['跌倒','Fall'],not_reach_goal:['未到目标停止','Stopped away from goal'],budget:['预算耗尽','Budget exhausted'],unknown:['未知','Unknown'],
frame:['观测','Observation'],action:['动作','Action'],distance:['参考路线偏距','Distance to reference'],beforePhase:['纠正前','Before correction'],afterPhase:['纠正后（已站稳）','After correction (settled)'],walkPhase:['自主导航','Autonomous navigation'],endPhase:['任务结束','Episode ended'],
recorded:['实际保存的 RGB 观测。','Actual recorded RGB observation.'],reused:['此处复用此前保存的 RGB，不是该位置新采集的画面。','Previously recorded RGB is reused here; it is not a new capture at this position.'],beforeAction:['即将瞬移；下一动作在纠正后画面产生。','About to teleport; the next action is issued from the corrected observation.'],noneAction:['无后续动作','No following action'],forward:['前进','Forward'],left:['左转','Turn left'],right:['右转','Turn right'],stop:['停止（STOP）','Stop (STOP)'],
event:['纠正','Correction'],translation:['水平瞬移距离','Horizontal teleport distance'],goalDistance:['落点水平距目标','Landing-to-goal horizontal distance'],triggerDistance:['实际触发偏距','Actual trigger distance'],threshold:['阈值','Threshold'],preserved:['纠正前后记忆 SHA256 相同','Memory SHA256 is identical before and after'],special:['官方成功，但实际以“{reason}”终止。终点距目标 {ne} 米；请与正常成功停止区分。','Official success, but termination was “{reason}”. Final goal distance: {ne} m. Distinguish this from a normal successful stop.'],
empty:['没有匹配的任务','No matching tasks'],task:['任务','Task'],historical:['历史结果','Historical result'],events:['纠正次数','Corrections'],seed:['种子','Seed'],sourceRun:['来源运行','Source run']};
Object.assign(I,{
corrected_success:['纠错后成功','Success with intervention'],corrected_failure:['纠错后失败','Failure with intervention'],uncorrected_success:['未纠错成功','Success without intervention'],uncorrected_failure:['未纠错失败','Failure without intervention'],
'baseline NE (m)':['原版NE（米）','Baseline NE (m)'],outcome:['干预与最终结果','Intervention and final outcome'],pairedBaseline:['原版对照','Baseline'],pairedAuto:['自动纠错组','Correction arm'],correctedSuccess:['实际纠错后成功','Succeeded with intervention'],initialPhase:['初始化位姿（预热前）','Initial pose (before warmup)'],
missingRgb:['该位置未保存RGB图像。地图仍显示该位置的真实轨迹。原版仅保存前两个策略观测的图像。','No RGB image was saved at this position. The map still shows the recorded position. Only the first two baseline policy observations have saved images.'],
reviewLabel:['原版失败归因（离线轨迹审阅）','Baseline failure attribution (offline trajectory review)'],confidence:['证据强度','Evidence strength'],high:['较强','High'],moderate:['中等','Moderate'],
pairCaveat:['两组独立运行；“纠错后成功”表示有干预记录且最终成功，不是共享前缀的因果证明。','Independent runs: success with intervention means a recorded intervention and final success, not causal proof from a shared prefix.'],

Object.assign(I,D.labels||{});
let lang='zh',ci=0,ni=0,ei=0,source='oracle',indices={oracle:0,original:0},playing=false,timer=null,view=null,filter='all',query='';
const layers={reference:true,original:true,oracle:true,jumps:true,targets:true,radius:false};
const t=k=>I[k]?.[lang==='zh'?0:1]??k,fmt=(n,d=2)=>Number(n).toFixed(d),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const c=()=>D.cases[ci],nodes=()=>source==='oracle'?c().nodes:c().original,n=()=>nodes()[ni],event=()=>c().events[ei],reason=m=>t(({success:'successEnd',stuck:'stuck',fall:'fall',not_reach_goal:'not_reach_goal',timeout:'budget',max_steps:'budget'})[m]||'unknown');
const action=k=>t(({0:'stop',1:'forward',2:'left',3:'right'})[k]||'noneAction');
function visible(x){return(!query||x.id.toLowerCase().includes(query))&&(filter==='all'||filter==='success'&&x.metrics.success||filter==='failure'&&!x.metrics.success||filter==='triggered'&&x.events.length||filter==='none'&&!x.events.length||filter==='special'&&x.metrics.success&&x.metrics.fail_reason!=='success'||D.paired&&filter===x.outcome)}
function stop(){playing=false;clearTimeout(timer);$('play').textContent=t('play')}
function image(id,index){const missing=index==null;$(id).classList.toggle('hidden',missing);if(missing){$(id).removeAttribute('src');delete $(id).dataset.image}else{$(id).src=D.images[index];$(id).dataset.image=index}}
function renderStats(){const s=D.summary;$('stats').innerHTML=[[s.tasks+'/'+D.cases.length,'tasks',s.annotations+' '+t('annotations')],[fmt(s.success/s.tasks*100,1)+'%','official',s.success+'/'+s.tasks],D.paired?[s.outcomes.corrected_success,'correctedSuccess',fmt(s.outcomes.corrected_success/s.tasks*100,2)+'%']:[s.normal_success,'normalSuccess','SPL '+fmt(s.mean_spl*100,2)+'%'],[s.triggered+'/'+D.cases.length,'triggered','NE '+fmt(s.mean_ne)+' m'],[s.events,'count',t('threshold')+' '+D.threshold+' m']].map(([v,k,n])=>`<div class="stat"><small>${t(k)}</small><b>${v}</b><small>${n}</small></div>`).join('')}
function renderList(){$('cases').innerHTML=D.cases.map((x,i)=>visible(x)?`<button class="case ${i===ci?'selected':''}" data-case="${i}">${String(i+1).padStart(2,'0')} · ${esc(x.id.replace('kujiale_',''))}<small><span class="badge ${x.metrics.success?'good':'bad'}">${t(x.metrics.success?'success':'failure')}</span> · ${t('event')} ×${x.events.length} · NE ${fmt(x.metrics.NE)}${D.paired?'<br>'+t(x.outcome):''}</small></button>`:'').join('')||`<p class="help">${t('empty')}</p>`}
function renderTask(){const x=c(),m=D.paired&&source==='original'?x.original_metrics:x.metrics;$('task-title').textContent=`${String(ci+1).padStart(2,'0')} / ${D.cases.length} · ${x.id}`;$('instruction').textContent=lang==='zh'?x.instruction_zh:x.instruction;$('task-meta').innerHTML=`<span class="badge ${m.success?'good':'bad'}">${t(m.success?'successful':'failed')}</span><span>${t('termination')}：${reason(m.fail_reason)}</span><span>NE ${fmt(m.NE)} m · SPL ${fmt(m.spl*100)}%</span><span>${D.paired&&source==='original'?x.original_actions:x.actions} ${t('action')} · ${D.paired&&source==='original'?0:x.events.length} ${t('events')}</span>`;const special=m.success&&m.fail_reason!=='success';$('special-note').classList.toggle('hidden',!special);$('special-note').textContent=t('special').replace('{reason}',reason(m.fail_reason)).replace('{ne}',fmt(m.NE));$('provenance').textContent=`${t('sourceRun')}: ${x.source_run} · ${t('seed')}: ${D.seed}`;
$('pair-note').classList.toggle('hidden',!D.paired);$('review-note').classList.toggle('hidden',!D.paired);
if(D.paired){$('pair-note').textContent=`${t('pairedBaseline')}: ${t(x.original_metrics.success?'success':'failure')} (NE ${fmt(x.original_metrics.NE)} m, ${reason(x.original_metrics.fail_reason)}) → ${t('pairedAuto')}: ${t(x.metrics.success?'success':'failure')} (NE ${fmt(x.metrics.NE)} m, ${reason(x.metrics.fail_reason)}) · ${t(x.outcome)} · ${x.events.length} ${t('events')}。 ${t('pairCaveat')}`;$('review-note').textContent=`${t('reviewLabel')} · ${t('confidence')}: ${t(x.review.confidence)} — ${lang==='zh'?x.review.reason_zh:x.review.reason_en}`;}}

function renderLegend(){const opts=[['reference','#12846a','reference'],['original','#d0642b','originalShort'],['oracle','#2374d5','oracleShort'],['jumps','#8848c8','teleport'],['targets','#a0700c','crossing'],['radius','#12846a','radius']];$('legend').innerHTML=opts.filter(([k])=>k!=='original'||D.has_original!==false).map(([k,color,label])=>`<label style="color:${color}"><input type="checkbox" data-layer="${k}" ${layers[k]?'checked':''}><span class="swatch" style="${k==='jumps'?'border-top-style:dashed':''}"></span>${t(label)}</label>`).join('');}
function coord(p){const g=D.maps[c().scene].geometry;return[(p[0]-g.low[0])/g.resolution,(g.high[1]-p[1])/g.resolution]}
function fullView(){const g=D.maps[c().scene].geometry;return[0,0,g.width,g.height]}
function path(points){return points.map((p,i)=>(i?'L':'M')+coord(p).map(v=>fmt(v,3)).join(',')).join(' ')}
function segments(ns){let result=[],part=[];for(const p of ns){if(part.length&&part[part.length-1].segment!==p.segment){result.push(part);part=[]}part.push(p)}if(part.length)result.push(part);return result}
function label(p,text,color,dy=-8){const q=coord(p);return`<text x="${q[0]+6}" y="${q[1]+dy}" font-size="9" fill="${color}">${esc(text)}</text>`}
function circle(p,r,color,stroke='white'){const q=coord(p);return`<circle cx="${q[0]}" cy="${q[1]}" r="${r}" fill="${color}" stroke="${stroke}" stroke-width="1.2"/>`}
function route(ns,color,width,opacity=1,klass=''){return segments(ns).map(part=>`<path class="${klass}" d="${path(part.map(p=>p.p))}" fill="none" stroke="${color}" stroke-width="${width}" stroke-opacity="${opacity}" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
function drawMap(){const x=c(),g=D.maps[x.scene].geometry;let h=`<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8848c8"/></marker></defs><image href="${D.images[D.maps[x.scene].image]}" x="0" y="0" width="${g.width}" height="${g.height}" opacity=".75"/>`;
if(layers.radius){const q=coord(x.reference.at(-1));h+=`<circle cx="${q[0]}" cy="${q[1]}" r="${3/g.resolution}" stroke="#12846a" stroke-dasharray="4 5" fill="#12846a0a" stroke-width="1"/>`}
if(layers.reference)h+=`<path data-route="reference" d="${path(x.reference)}" fill="none" stroke="#12846a" stroke-width="3.2" stroke-linejoin="round"/>`;
if(layers.original)h+=route(x.original,'#d0642b',2,.65,'original-route');
if(layers.oracle)h+=route(x.nodes,'#2374d5',2.2,.23,'oracle-route');
if(source==='oracle'&&layers.oracle)h+=route(x.nodes.slice(0,ni+1),'#2374d5',3,1,'played-route');
if(source==='original'&&layers.original)h+=route(x.original.slice(0,ni+1),'#d0642b',3,1,'played-route');
if(layers.jumps)x.events.forEach((e,j)=>{const a=coord(x.nodes[e.before].p),b=coord(x.nodes[e.after].p),selected=j===ei;h+=`<g data-jump="${j}" style="cursor:pointer"><path d="M${a}L${b}" stroke="#8848c8" stroke-width="${selected?2.4:1.3}" stroke-opacity="${selected?1:.35}" stroke-dasharray="5 4" marker-end="url(#arrow)"/><circle cx="${a[0]}" cy="${a[1]}" r="${selected?4:2.5}" fill="#8848c8"/><text x="${a[0]+5}" y="${a[1]-4}" font-size="8" fill="#7736b5">${j+1}</text></g>`});
if(layers.targets)x.targets.forEach((p,j)=>{h+=circle(p.crossing_position,4,'#e2ac29')+label(p.crossing_position,'C'+(j+1),'#956400');if(p.target_xy){const q=coord(p.target_xy);h+=`<path d="M${q[0]-4},${q[1]}h8M${q[0]},${q[1]-4}v8" stroke="#8848c8" stroke-width="2"/>`+label(p.target_xy,'T'+(j+1),'#8848c8',11)}});
h+=circle(x.reference[0],3.5,'#244659')+label(x.reference[0],'S','#244659');h+=circle(x.reference.at(-1),4.2,'#12846a')+label(x.reference.at(-1),'G','#12846a');const p=n(),q=coord(p.p);h+=circle(p.p,4.5,source==='oracle'?'#2374d5':'#d0642b')+label(p.p,'P',source==='oracle'?'#2374d5':'#d0642b',14);if(p.yaw!=null){h+=`<path d="M${q[0]},${q[1]}l${Math.cos(p.yaw)*14},${-Math.sin(p.yaw)*14}" stroke="#102f4b" stroke-width="2"/>`}
$('map').innerHTML=h;$('map').setAttribute('viewBox',(view||fullView()).join(' '));}
function phase(p){return t(({before:'beforePhase',after:'afterPhase',end:'endPhase',walk:'walkPhase',initial:'initialPhase'})[p.phase])}
function renderNode(){const p=n();image('rgb',p.image);$('missing-rgb').classList.toggle('hidden',p.image!=null);$('missing-rgb').textContent=t('missingRgb');for(const id of ['map-timeline','rgb-timeline']){$(id).max=nodes().length-1;$(id).value=ni}const clock=`${t('frame')} ${ni+1}/${nodes().length} · ${t('action')} ${p.a} · ${phase(p)}`;$('map-clock').textContent=clock;$('rgb-clock').textContent=clock;$('source-label').textContent=t(source==='oracle'?'oracleShort':'originalShort');$('node-meta').innerHTML=`<span>${t('distance')} <b>${fmt(p.distance)} m</b></span><span>${t('action')}：<b>${p.phase==='before'?t('beforePhase'):action(p.action)}</b></span><span>${t('event')} ×${p.segment}</span>`;$('rgb-note').textContent=(p.image==null?t('missingRgb'):(p.reused?t('reused'):t('recorded')))+(p.phase==='before'?' '+t('beforeAction'):'');drawMap();}
function renderEvents(){const ev=c().events;$('events').innerHTML=ev.map((e,j)=>`<button data-event="${j}" class="${j===ei?'active':''}">#${e.number} · A${e.a} · ${fmt(e.distance)} m</button>`).join('');$('no-event').classList.toggle('hidden',ev.length!==0);$('event-detail').classList.toggle('hidden',!ev.length);if(!ev.length)return;const e=event();$('event-heading').textContent=`${t('event')} #${e.number}/${ev.length} · ${t('action')} ${e.a}`;$('event-facts').innerHTML=[[t('threshold'),fmt(e.threshold)+' m'],[t('triggerDistance'),fmt(e.distance)+' m'],[t('translation'),fmt(e.translation)+' m'],[t('goalDistance'),fmt(e.goal_distance)+' m'],...(D.mode==='auto_branch'?[[t('branchInterval'),e.branch_action_interval.map(v=>fmt(v,0)).join('–')],[t('actualOffset'),fmt(e.actual_offset_m)+' / '+fmt(e.requested_offset_m)+' m'],[t('endpointClamp'),t(e.clamped_to_route_end?'yes':'no')],[t('landingError'),fmt(e.landing_error_m*100,1)+' cm']]:[])].map(([a,b])=>`<span>${a}：<b>${b}</b></span>`).join('');image('before-rgb',e.before_image);image('after-rgb',e.after_image);$('before-caption').textContent=t('beforePhase')+' · A'+e.a;$('after-caption').textContent=t('afterPhase')+' · A'+(e.after_action??e.a);$('memory').textContent=t('preserved')+'\n'+e.memory;$('near-note').classList.toggle('hidden',e.goal_distance>=3);}
function renderTicks(){const h=source==='oracle'?c().events.map(e=>`<span class="tick" style="left:${100*e.before/(nodes().length-1)}%"></span>`).join(''):'';$('map-ticks').innerHTML=h;$('rgb-ticks').innerHTML=h;}
function setNode(i,pause=true){if(pause)stop();ni=Math.max(0,Math.min(nodes().length-1,Number(i)));indices[source]=ni;if(source==='oracle'&&c().events.length){ei=Math.max(0,c().events.findLastIndex(e=>e.before<=ni));renderEvents()}renderNode()}
function setSource(value){stop();if(value==='original'&&D.has_original===false)return;source=value;$('source').value=value;ni=indices[value];renderTask();renderTicks();renderNode()}
function selectEvent(j,side='before'){ei=Number(j);source='oracle';$('source').value=source;renderTask();renderTicks();setNode(event()[side]);renderEvents()}
function fit(){const ps=[...c().reference,...c().original.map(n=>n.p),...c().nodes.map(n=>n.p)].map(coord),xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]),minx=Math.min(...xs),miny=Math.min(...ys);view=[minx-20,miny-20,Math.max(70,Math.max(...xs)-minx+40),Math.max(70,Math.max(...ys)-miny+40)];drawMap()}
function selectCase(i){stop();ci=Number(i);ei=0;source='oracle';$('source').value=source;ni=c().events[0]?.before??0;indices={oracle:ni,original:0};view=null;renderList();renderTask();renderEvents();renderTicks();renderNode();fit();}
function zoom(f){const v=(view||fullView()).slice(),cx=v[0]+v[2]/2,cy=v[1]+v[3]/2;v[2]/=f;v[3]/=f;v[0]=cx-v[2]/2;v[1]=cy-v[3]/2;view=v;drawMap()}
function play(){if(playing){stop();return}if(ni===nodes().length-1)setNode(0);playing=true;$('play').textContent=t('pause');const tick=()=>{if(!playing)return;setNode(ni+1,false);if(ni===nodes().length-1){stop();return}timer=setTimeout(tick,Number($('speed').value))};timer=setTimeout(tick,Number($('speed').value))}
function renderTable(){$('results-table').innerHTML=`<thead><tr>${['task',...(D.has_original===false?[]:['historical']),'official','termination','NE (m)','SPL','events',...(D.paired?['outcome','baseline NE (m)']:[]),'sourceRun'].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>${D.cases.map((x,i)=>visible(x)?`<tr data-case="${i}"><td>${i+1} · ${esc(x.id)}</td>${D.has_original===false?'':`<td>${t(x.historical_success?'success':'failure')}</td>`}<td><span class="badge ${x.metrics.success?'good':'bad'}">${t(x.metrics.success?'success':'failure')}</span></td><td>${reason(x.metrics.fail_reason)}</td><td>${fmt(x.metrics.NE)}</td><td>${fmt(x.metrics.spl*100)}%</td><td>${x.events.length}</td>${D.paired?`<td>${t(x.outcome)}</td><td>${fmt(x.original_metrics.NE)}</td>`:''}<td>${x.source_run}</td></tr>`:'').join('')}</tbody>`}
function showTable(show){stop();$('replay-view').classList.toggle('hidden',show);$('results-view').classList.toggle('hidden',!show);$('tab-replay').classList.toggle('active',!show);$('tab-results').classList.toggle('active',show);if(show)renderTable()}
function language(value){lang=value;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));renderStats();renderList();renderTask();renderLegend();renderEvents();renderNode();renderTable();$('play').textContent=t(playing?'pause':'play');}
function exportCsv(){const rr=[['episode_id','official_success','termination','NE_m','SPL','interventions','source_run',...(D.paired?['baseline_SR','baseline_NE_m','baseline_termination','paired_outcome','baseline_reason_zh','baseline_reason_en']:[])],...D.cases.map(x=>[x.id,x.metrics.success,x.metrics.fail_reason,x.metrics.NE,x.metrics.spl,x.events.length,x.source_run,...(D.paired?[x.original_metrics.success,x.original_metrics.NE,x.original_metrics.fail_reason,x.outcome,x.review.reason_zh,x.review.reason_en]:[])])];const blob=new Blob(['\ufeff'+rr.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='oracle_'+(D.arm||'early')+'_results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('language').onchange=e=>language(e.target.value);$('source').onchange=e=>setSource(e.target.value);$('play').onclick=play;$('start').onclick=()=>setNode(0);$('end').onclick=()=>setNode(nodes().length-1);$('prev').onclick=()=>setNode(ni-1);$('next').onclick=()=>setNode(ni+1);for(const id of ['map-timeline','rgb-timeline'])$(id).oninput=e=>setNode(e.target.value);$('before').onclick=()=>selectEvent(ei,'before');$('after').onclick=()=>selectEvent(ei,'after');$('zoom-in').onclick=()=>zoom(1.3);$('zoom-out').onclick=()=>zoom(1/1.3);$('fit').onclick=fit;$('scene').onclick=()=>{view=null;drawMap()};$('tab-replay').onclick=()=>showTable(false);$('tab-results').onclick=()=>showTable(true);$('export').onclick=exportCsv;$('filter').onchange=e=>{filter=e.target.value;renderList();renderTable()};$('search').oninput=e=>{query=e.target.value.toLowerCase();renderList();renderTable()};$('close').onclick=()=>$('dialog').close();
document.addEventListener('click',e=>{const b=e.target.closest('[data-case],[data-event],[data-jump]');if(b?.dataset.case!=null){showTable(false);selectCase(b.dataset.case)}else if(b?.dataset.event!=null)selectEvent(b.dataset.event);else if(b?.dataset.jump!=null)selectEvent(b.dataset.jump);if(e.target.matches('#rgb,#before-rgb,#after-rgb')){stop();$('large').src=e.target.src;$('dialog').showModal()}});$('legend').onchange=e=>{if(e.target.dataset.layer){layers[e.target.dataset.layer]=e.target.checked;drawMap()}};
let drag=null;$('map').onpointerdown=e=>{if(e.target.closest('[data-jump]'))return;const matrix=$('map').getScreenCTM();if(!matrix)return;drag={x:e.clientX,y:e.clientY,view:(view||fullView()).slice(),scale:matrix.a};$('map').setPointerCapture(e.pointerId)};$('map').onpointermove=e=>{if(!drag)return;view=drag.view.slice();view[0]-=(e.clientX-drag.x)/drag.scale;view[1]-=(e.clientY-drag.y)/drag.scale;drawMap()};$('map').onpointerup=()=>drag=null;$('map').onpointercancel=()=>drag=null;$('map').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12)},{passive:false});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$('dialog').open)return;if(e.key==='ArrowRight'){e.preventDefault();setNode(ni+1)}else if(e.key==='ArrowLeft'){e.preventDefault();setNode(ni-1)}else if(e.code==='Space'){e.preventDefault();play()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
window.ORACLE_DISTANCE={data:D,selectCase,selectEvent,setNode,setSource,language,state:()=>({caseIndex:ci,nodeIndex:ni,eventIndex:ei,source,node:n(),event:event(),playing,lang})};if(D.has_original===false){document.querySelector('#source option[value="original"]').remove();layers.original=false;}if(D.paired){for(const key of ['corrected_success','corrected_failure','uncorrected_success','uncorrected_failure']){const option=document.createElement('option');option.value=key;option.dataset.i=key;$('filter').appendChild(option)}}language('zh');selectCase(0);$('loading').remove();
</script></body></html>
