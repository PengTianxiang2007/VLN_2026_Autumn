<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VLNVerse 导航复盘</title><style>
body{font:16px system-ui,sans-serif;background:#111722;color:#e3eaf4;margin:24px auto;max-width:1300px;padding:0 18px}h1{font-size:26px}select,input,button{font:inherit;padding:8px;background:#202c3f;color:inherit;border:1px solid #50627c;border-radius:5px}a{color:#8dc5ff}main{display:grid;grid-template-columns:minmax(310px,430px) 1fr;gap:24px;margin-top:20px}#cases{max-height:75vh;overflow:auto}button.case{display:block;text-align:left;width:100%;margin-bottom:8px}.muted{color:#acb9ca;font-size:14px}video{width:100%;background:#000}pre{white-space:pre-wrap;word-break:break-word}.filters{display:flex;gap:8px;flex-wrap:wrap}.active{outline:2px solid #86baff}#path{max-width:320px}@media(max-width:800px){main{display:block}#cases{max-height:30vh}}</style>
<h1>VLNVerse 导航复盘 · seed 2 / 3</h1>
<p class="muted">每个模型动作对应一帧 RGB，附最终观测；6 fps 是回放速度。轨迹为 XY 示意图，绿色参考、蓝色实际；参考路径仅用于复盘。新增记录后刷新页面。</p>
<div class="filters"><select id="seed"><option value="">全部 seed</option><option>2</option><option>3</option></select><select id="scene"><option value="">全部场景</option></select><select id="outcome"><option value="">全部结果</option><option value="failure">SR=0</option><option value="success">SR=1</option><option value="abnormal">异常终止原因</option><option value="video_error">录像异常</option></select><input id="query" placeholder="搜索 episode / 指令 / 原因"></div>
<p id="count" class="muted"></p><main><section id="cases"></section><section><video id="video" controls preload="metadata"></video><h2 id="title">等待选定 seed 开始产生录像</h2><p id="instruction"></p><pre id="metrics"></pre><p id="links"></p><img id="path" alt="轨迹图" hidden></section></main>
<script>
const rows=__REVIEW_DATA__, $=id=>document.getElementById(id);
for(const name of [...new Set(rows.map(r=>r.scene))].sort()){let o=document.createElement('option');o.textContent=name;$('scene').append(o)}
function show(r){$('video').src=r.video;$('title').textContent=`seed ${r.seed} · ${r.episode_id}`;$('instruction').textContent=r.instruction;$('metrics').textContent=`SR ${r.metrics.success} | SPL ${r.metrics.spl.toFixed(4)} | NE ${r.metrics.NE.toFixed(3)} m\n终止原因：${r.fail_reason}\n录像状态：${r.status} | ${r.frames} 帧`;$('links').replaceChildren();for(const [text,key] of [['完整记录','detail'],['逐动作记录','steps'],['视频文件','video']]){const a=document.createElement('a');a.href=r[key];a.textContent=text;a.style.marginRight='18px';$('links').append(a)}$('path').src=r.trajectory;$('path').hidden=false}
function render(){const q=$('query').value.toLowerCase(),out=$('outcome').value;let data=rows.filter(r=>(!$('seed').value||r.seed==$('seed').value)&&(!$('scene').value||r.scene==$('scene').value)&&(!q||`${r.episode_id} ${r.instruction} ${r.fail_reason}`.toLowerCase().includes(q))&&(!out||(out==='failure'&&r.metrics.success===0)||(out==='success'&&r.metrics.success===1)||(out==='abnormal'&&!['success','not_reach_goal',''].includes(r.fail_reason))||(out==='video_error'&&r.status==='error')));data.sort((a,b)=>a.metrics.success-b.metrics.success||a.seed-b.seed||a.episode_id.localeCompare(b.episode_id));$('count').textContent=`显示 ${data.length} / 已记录 ${rows.length} 条；计划 500 条。失败项优先。`;$('cases').replaceChildren();for(const r of data){let b=document.createElement('button');b.className='case';b.textContent=`seed ${r.seed} · ${r.episode_id}\nSR ${r.metrics.success} · ${r.fail_reason}`;b.onclick=()=>show(r);$('cases').append(b)}}
for(const id of ['seed','scene','outcome','query'])$(id).addEventListener('input',render);render();if(rows.length)show([...rows].sort((a,b)=>a.metrics.success-b.metrics.success)[0]);
</script></html>
