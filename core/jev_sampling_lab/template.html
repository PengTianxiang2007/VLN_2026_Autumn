<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEV · 滤波与采样</title><link rel="icon" href="data:,">
<style>
[hidden]{display:none!important}
:root{--ink:#17344e;--muted:#65788a;--line:#d9e2eb;--paper:#fff;--bg:#edf2f6;--blue:#2563eb;--teal:#13845c;--red:#b33a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
header{background:linear-gradient(115deg,#17344e,#1d5a68);color:#fff;padding:22px 26px}header h1{margin:0 0 5px;font-size:24px}.sub{font-size:12px;opacity:.82}
.layout{display:grid;grid-template-columns:245px minmax(650px,1fr) 390px;gap:14px;padding:14px 16px 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;min-width:0}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 7px}p{margin:7px 0}.muted{color:var(--muted);font-size:12px}
button,select,input,textarea{font:inherit}button,select{border:1px solid #c5d2de;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink)}button{cursor:pointer}button:hover,button.active{background:#e6f0fb;border-color:#4f8dcc}
#cases button{display:block;width:100%;text-align:left;white-space:pre-line;margin:7px 0;font-size:12px}#cases{max-height:610px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px 0}.metric,.notice{background:#fff;border:1px solid var(--line);border-radius:10px}.metric{padding:11px 14px}.metric strong{display:block;font-size:24px;font-variant-numeric:tabular-nums}.metric span{font-size:12px;color:var(--muted)}.notice{margin:12px 16px;padding:10px 14px;border-left:4px solid #c58317}
.mapGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mapTitle{font-weight:700;margin:0 0 5px}.evidenceMap{display:block;width:100%;height:430px;background:#f3f6f9;border-radius:7px}.playback{margin:9px 0}input[type=range]{width:100%;accent-color:var(--blue)}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}.swatch{display:inline-block;width:26px;height:5px;margin-right:5px;vertical-align:middle}
#scorePlot{display:block;width:100%;height:220px;background:#fff}.filterBox{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0;background:#f8fafc}.filterBox strong{display:block;margin-bottom:5px}.filterOptions{display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center;font-size:12px}.filterOptions input[type=range]{width:180px;accent-color:#2563eb}.filterLegend{display:flex;flex-wrap:wrap;gap:5px 13px;font-size:11px;margin-top:6px}.filterLegend i{display:inline-block;width:23px;height:4px;margin-right:4px;vertical-align:middle}#rgb{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#122432;border-radius:7px}.values{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 0}.value{border:1px solid var(--line);border-radius:7px;padding:8px}.value b{display:block;font-size:18px}.value span{font-size:11px;color:var(--muted)}#history{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#history button{padding:3px;font-size:11px}#history img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}pre{white-space:pre-wrap;word-break:break-word;background:#f3f6fa;padding:10px;border-radius:6px;max-height:280px;overflow:auto;font:12px/1.55 ui-monospace,monospace}details{margin:10px 0}summary{cursor:pointer;font-weight:700}.listButton{display:block;width:100%;text-align:left;margin:5px 0;font-size:12px}textarea{width:100%;min-height:70px;border:1px solid #c5d2de;border-radius:6px;padding:8px}.footer{padding:0 18px 20px;color:var(--muted);font-size:12px}
@media(max-width:1250px){.layout{grid-template-columns:230px 1fr}.layout>aside:last-child{grid-column:2}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.layout{display:block}.panel{margin-bottom:12px}.mapGrid{grid-template-columns:1fr}.evidenceMap{height:340px}.stats{grid-template-columns:repeat(2,1fr)}header{padding:18px}h1{font-size:20px}.values{grid-template-columns:1fr}}

@font-face{font-family:CrossingSans;src:url(assets/89d7a2e507302378d5b32e4979f5fdc3eecdfcf18035d6678b6ab46ef8a44991.ttf)}body,button,select,input,textarea{font-family:CrossingSans,sans-serif}
.stats{grid-template-columns:repeat(4,1fr)}.mapGrid{grid-template-columns:1fr}.values{grid-template-columns:1fr}
.layout{grid-template-columns:245px minmax(560px,1fr) 360px}.evidenceMap{height:430px}
fieldset.filterBox{min-width:0;margin:12px 0;padding:10px 12px}fieldset.filterBox legend{padding:0 5px;font-weight:700;font-size:14px}
.curveOptions{display:flex;gap:14px 24px;align-items:center;flex-wrap:wrap}.curveOptions label{display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer}
.curveOptions input,.samplingOption input{accent-color:#2563eb}.curveOptions i{display:inline-block;width:22px;height:3px}
.parameterOptions{display:flex;gap:10px 22px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12px}
.parameterOptions label{display:flex;align-items:center;gap:7px}.parameterOptions input{width:140px}.parameterOptions output{min-width:14px;font-variant-numeric:tabular-nums}
#samplingVersions{display:grid;gap:8px}.samplingOption{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid #d9e2eb;border-radius:6px;background:#fff;cursor:pointer}
.samplingOption:has(input:checked){border-color:var(--sample-color);background:#f0fafc}.samplingOption input{accent-color:var(--sample-color)}
.samplingCopy{display:flex;flex-direction:column;min-width:0}.samplingCopy strong{margin:0;font-size:13px}.sampleCount{margin-left:auto;white-space:nowrap;font-size:12px;color:#087d98}
#sampleEvents p{overflow-wrap:anywhere;margin-bottom:0}#timeline{margin-top:10px}#scorePlot{height:230px}#pendingHint{margin:2px 0 8px}
@media(max-width:1250px){.layout{grid-template-columns:220px minmax(0,1fr)}.layout>aside:last-child{grid-column:2}.stats{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.layout{display:block}.stats{grid-template-columns:repeat(2,1fr)}.evidenceMap{height:340px}.parameterOptions{display:block}.parameterOptions label{margin:5px 0}.sampleCount{white-space:normal}}
</style></head><body>
<header><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select><h1 data-i18n="title"></h1><div class="sub" data-i18n="subtitle"></div></header>
<div class="stats" id="stats"></div><div class="notice" data-i18n="notice"></div>
<main class="layout">
<aside class="panel"><h2 data-i18n="cases"></h2><select id="filters" aria-label="Trajectory group"><option value="all" data-i18n="all"></option><option value="failure" data-i18n="failure"></option><option value="success" data-i18n="success"></option></select><div id="cases"></div><button id="export" data-i18n="export"></button><p class="muted" data-i18n="source"></p></aside>
<section class="panel"><h2 id="title"></h2><p id="caseStats"></p>
<div class="mapGrid"><div><p class="mapTitle" data-i18n="map"></p><canvas class="evidenceMap" id="jevMap" aria-label="JEV top-down map"></canvas><div class="legend"><span><i class="swatch" style="background:rgb(250,224,199)"></i>0</span><span><i class="swatch" style="background:rgb(195,127,114)"></i>0.5</span><span><i class="swatch" style="background:rgb(139,29,29)"></i>1</span></div></div></div>
<div class="playback"><label for="frame" data-i18n="mapProgress"></label><input id="frame" type="range" min="0" value="0"><div id="step"></div></div>
<div class="controls"><button id="restart" data-i18n="restart"></button><button id="prev" data-i18n="prev"></button><button id="play" data-i18n="play"></button><button id="next" data-i18n="next"></button><label><input id="reference" type="checkbox"> <span data-i18n="reference"></span></label></div>
<h3 data-i18n="plot"></h3>
<fieldset class="filterBox" id="curveControls"><legend data-i18n="curveTitle"></legend>
<div class="curveOptions"><label><input id="showRawJev" type="checkbox" checked><i style="background:#b33a3a"></i><span data-i18n="raw"></span></label><label><input id="showFiltered" type="checkbox" checked><i style="background:#2563eb"></i><span data-i18n="filtered"></span></label></div>
<div class="parameterOptions"><label><span data-i18n="window"></span><input id="filterWindow" type="range" min="3" max="31" step="2" value="7"><output id="filterWindowValue">7</output></label><label><span data-i18n="delay"></span><input id="streamDelay" type="range" min="0" max="5" step="1" value="5"><output id="streamDelayValue">5</output></label></div><p class="muted" data-i18n="curveHint"></p>
</fieldset>
<fieldset class="filterBox" id="samplingControls"><legend data-i18n="samplingTitle"></legend><div id="samplingVersions"></div><p class="muted" data-i18n="samplingHint"></p><p class="muted" id="samplingStatus"></p><div id="sampleEvents"></div></fieldset>
<p class="muted" id="timeline"></p><canvas id="scorePlot" aria-label="JEV probability waveform"></canvas><p class="muted" id="pendingHint"></p>
<details><summary data-i18n="rules"></summary><p class="muted" data-i18n="ruleText"></p><p class="muted" data-i18n="rulesNote"></p></details>
<details><summary data-i18n="prompt"></summary><h3 data-i18n="promptChinese"></h3><pre id="promptChinese"></pre><h3 data-i18n="promptEnglish"></h3><pre id="promptEnglish"></pre></details>
<details><summary data-i18n="protocol"></summary><p data-i18n="protocolInput"></p><p data-i18n="protocolReplay"></p></details>
</section>
<aside class="panel"><h2 data-i18n="current"></h2><img id="rgb" alt="Current RGB observation"><div class="playback"><label for="imageFrame" data-i18n="imageProgress"></label><input id="imageFrame" type="range" min="0" value="0"><div id="imageStep"></div></div><div class="values"><div class="value"><b id="jevValue"></b><span data-i18n="probability"></span></div></div><p class="muted" id="inputInfo"></p><div id="history"></div>
<h3 data-i18n="review"></h3><select id="category" aria-label="Review category"><option value="" data-i18n="unclassified"></option><option value="jev_high" data-i18n="high"></option><option value="jev_low" data-i18n="low"></option><option value="reasonable" data-i18n="reasonable"></option><option value="other" data-i18n="other"></option></select><textarea id="note"></textarea><p class="muted" data-i18n="noteHint"></p><p class="muted" id="instruction"></p></aside>
</main><div class="footer" data-i18n="footer"></div>
<script id="payload" type="application/json">@@PAYLOAD_JSON@@</script>
<script src="online_filter.js"></script><script src="online_sampler_v001.js"></script><script src="app.js"></script>
</body></html>
