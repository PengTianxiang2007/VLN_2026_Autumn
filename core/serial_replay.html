ncluding STOP)'],reference:['正确参考轨迹','Reference route'],historical:['历史原始轨迹（seed 2）','Historical original (seed 2)'],current:['本次完整轨迹','Full current trajectory'],markers:['节点与人工点','Nodes and annotations'],first:['首节点','First node'],same:['重复：替换旧点','Same: replace old node'],different:['不同：保留两点','Different: keep both'],uncertain:['不确定','Uncertain'],consistent:['一致','Consistent'],deviated:['偏航','Deviated'],initialization:['初始化 A=B','Initialization A=B'],segment:['路段评审','Segment review'],node:['节点','Node'],candidateFrame:['节点所在帧','Node frame'],confirmFrame:['确认帧','Confirmation frame'],relation:['去重结论','Deduplication'],verdict:['评审结论','Review verdict'],retained:['当前保留','Currently retained'],replaced:['已被替换','Replaced'],future:['尚未确认','Not yet confirmed'],none:['无','None'],noReview:['当前帧之前没有该模块请求。','No request for this module has occurred by this frame.'],summary:['实际经历','Observed segment'],reason:['判断依据','Reason'],progress:['累计语义进度','Cumulative semantic progress'],noProgress:['本次未提交新的语义进度。','No new semantic progress was committed.'],priorProgress:['本次输入的此前进度','Prior progress supplied to this call'],instructionEvidence:['任务引用','Instruction evidence'],visualEvidence:['视觉依据','Visual evidence'],uncertainties:['尚未确认的问题','Unresolved questions'],matched:['对应分支','Matched branches'],onlyA:['仅A支持的分支','Branches supported only by A'],onlyB:['仅B支持的分支','Branches supported only by B'],source:['来源','Source'],probYes:['可作为回退候选的概率','Probability of being a fallback candidate'],probNo:['不可作为回退候选的概率','Probability of not being a fallback candidate'],noReason:['JEV本次只返回概率，没有文字理由。','JEV returned probabilities only, with no textual explanation.'],context:['上下文','Context'],instructions:['提示词','Instructions'],criterionTrue:['true条件','Criterion for true'],criterionFalse:['false条件','Criterion for false'],forward:['前进','Forward'],left:['左转','Turn left'],right:['右转','Turn right'],stop:['停止','STOP'],wait:['等待','Wait'],position:['位置','Position'],ticks:['物理tick','Physics ticks'],notTriggered:['未触发','Not  $('node-table').querySelector('thead').innerHTML='<tr>'+['node','candidateFrame','confirmFrame','relation','verdict','retained'].map(k=>`<th>${t(k)}</th>`).join('')+'</tr>';
}
function coord(p){const g=D.map.geometry;return[(p[0]-g.low[0])/g.resolution,(g.high[1]-p[1])/g.resolution]}
function path(points){return points.map((p,i)=>(i?'L':'M')+coord(p).map(x=>fmt(x,3)).join(',')).join(' ')}
function circle(p,r,color,label='',dx=6,dy=-6){const [x,y]=coord(p);return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="white" stroke-width="1.1"/>`+(label?`<text x="${x+dx}" y="${y+dy}" fill="${color}" font-size="9" stroke="white" stroke-width="2" paint-order="stroke">${esc(label)}</text>`:'')}
function drawMap(){const g=D.map.geometry;if(!view)view=[0,0,g.width,g.height];$('map').setAttribute('viewBox',view.join(' '));let svg=`<image width="${g.width}" height="${g.height}" href="${D.images[D.map.image]}"/>`;
 if(layers.reference)svg+=`<path class="reference-route" d="${path(D.reference)}" fill="none" stroke="#13846c" stroke-width="2.8"/>`+circle(D.reference.at(-1),5,'#13846c',lang==='zh'?'目标':'Goal');
 if(layers.historical)svg+=`<path class="historical-route" d="${path(D.historical)}" fill="none" stroke="#cc732e" stroke-width="5" stroke-dasharray="6 3" opacity=".8"/>`;
 if(layers.current)svg+=`<path class="current-route" d="${path(D.official_path)}" fill="none" stroke="#2374d5" stroke-width="2.3" opacity=".28"/>`+circle(D.official_path.at(-1),3,'#2374d5',lang==='zh'?'终点':'End');
 svg+=`<path d="${path(D.frames.slice(0,fi+1).map(f=>f.position))}" fill="none" stroke="#2374d5" stroke-width="2.8"/>`;
 const state=nodeState(),selected=latestNode();if(layers.markers){for(const n of D.nodes){const future=n.emittedAt>fi;if(future&&!$('show-all').checked)continue;const color=future?'#a5afb8':state.ids.includes(n.id)?'#7c4db2':'#b8a6c7';const p=D.frames[n.index].position;svg+=`<g data-node="${n.id}" style="cursor:pointer" opacity="${future?.6:1}">`+circle(p,3.2,color,n.id,6,n===D.nodes[0]?12:-6)+`</g>`}for(const a of D.annotations)svg+=circle(a.position,4,'#1e5bad',a.id,-28,-4);if(selected){const a=coord(D.frames[selected.index].position),b=coord(D.frames[selected.emittedAt].position);svg+=`<path d="M${a}L${b}" stroke="#ce4058" stroke-width="1" stroke-dasharray="3 2" fill="none"/>`+circle(D.frames[selected.emittedAt].position,3.8,'#ce4058','P '+selected.id)}}
 const f=frame(),[x,y]=coord(f.position),angle=-f.yaw*180/Math.PI;svg+=`<g transform="translate(${x} ${y}) rotate(${angle})"><path d="M8,0 L-4,-4 L-2,0 L-4,4Z" fill="#122c41" stroke="white" stroke-width="1"/></g>`;$('map').innerHTML=svg;
}
function drawChart(){const x=i=>38+i/(D.frames.length-1)*946,y=p=>115-p*95;let out='';for(const v of [0,.5,1])out+=`<line x1="38" x2="984" y1="${y(v)}" y2="${y(v)}" stroke="#e0e8ef"/><text x="4" y="${y(v)+4}" font-size="11" fill="#6a7a89">${v}</text>`;const chartPath=points=>points.map(([i,v],j)=>(j?'L':'M')+x(i)+','+y(v)).join(' ');
 out+=`<path d="${chartPath(D.frames.map(f=>[f.index,f.probability]))}" fill="none" stroke="#d7e3f1" stroke-width="2"/><path d="${chartPath(D.frames.slice(0,fi+1).map(f=>[f.index,f.probability]))}" fill="none" stroke="#2374d5" stroke-width="2.5"/>`;
 const filtered=D.frames.slice(0,fi+1).filter(f=>f.filtered).map(f=>[f.filtered.index,f.filtered.value]);if(filtered.length)out+=`<path d="${chartPath(filtered)}" fill="none" stroke="#7c4db2" stroke-width="2.5"/>`;
 for(const n of D.nodes.filter(n=>n.emittedAt<=fi))out+=`<circle cx="${x(n.index)}" cy="${y(n.value)}" r="4" fill="#7c4db2"/><text x="${x(n.index)+4}" y="${y(n.value)-8}" font-size="10" fill="#7c4db2">${n.id}</text>`;
 out+=`<line x1="${x(fi)}" x2="${x(fi)}" y1="10" y2="122" stroke="#253f55" stroke-dasharray="3 3"/><circle cx="${x(fi)}" cy="${y(frame().probability)}" r="4" fill="#2374d5"/>`;for(const i of [0,10,20,30,39])out+=`<text x="${x(i)-7}" y="140" font-size="11" fill="#6a7a89">F${i}</text>`;$('score-chart').innerHTML=out;
}
function renderNodes(){const state=nodeState(),selected=latestNode();$('node-table').querySelector('tbody').innerHTML=D.nodes.filter(n=>$('show-all').checked||n.emittedAt<=fi).map(n=>`<tr data-node="${n.id}" class="${n.emittedAt>fi?'future':''} ${selected?.id===n.id?'selected':''}"><td>${n.id}</td><td>F${n.index}</td><td>F${n.emittedAt}</td><td>${t(n.relation)}${n.replaced?' · '+n.replaced+' → '+n.id:''}</td><td>${t(n.mode)} · ${t(n.verdict)}</td><td>${n.emittedAt>fi?t('future'):state.ids.includes(n.id)?t('retained'):t('replaced')}</td></tr>`).join('');$('checkpoint-state').textContent=state.ids.length?`${t('checkpoint')}: ${state.ids.join(', ')} · ${t('anchor')}: ${state.anchor||t('none')}`:t('emptyCheckpoint');}
function showImage(image,caption){$('full-image').src=D.images[image];$('full-caption').textContent=caption;$('dialog').showModal()}
function answerHTML(c){const a=c.answer;if(c.stage==='jev')return `<div class="row spread"><span>${t('probYes')} <b>${fmt(a.probability_yes,2)}</b></span><span>${t('probNo')} ${fmt(a.probability_no,2)}</span></div><p class="muted">${t('noReason')}</p>`;
 if(c.stage==='dedup')return `<span class="badge ${a.relation==='same'?'good':'warn'}">${t(a.relation)}</span>`+part('reason',a.reason)+`<h3>${t('matched')}</h3><ul>${a.matched_branches.map(b=>`<li>${esc(text(b.description))}<br><small>A: ${b.a_frames.join(', ')} · B: ${b.b_frames.join(', ')}</small></li>`).join('')}</ul>`+list('onlyA',a.a_only)+list('onlyB',a.b_only);
 return `<span class="badge ${a.verdict==='consistent'?'good':a.verdict==='deviated'?'bad':'warn'}">${t(a.verdict)} · ${t(c.metadata.mode)}</span>`+part('summary',a.segment_summary)+part('reason',a.reason)+`<div class="anchor-line">`+part('priorProgress',c.prior_progress)+part('progress',a.semantic_progress||t('noProgress'))+`</div><h3>${t('instructionEvidence')}</h3>`+(a.instruction_evidence.length?`<ul>${a.instruction_evidence.map(q=>`<li>${esc(q[lang==='zh'?'quote_zh':'quote_en'])}</li>`).join('')}</ul>`:`<p class="muted">${t('none')}</p>`)+`<h3>${t('visualEvidence')}</h3><ul>${a.visual_evidence.map(v=>`<li>${esc(text(v.description))}<br><small>${v.frames.map(f=>'F'+f).join(', ')}</small></li>`).join('')}</ul>`+list('uncertainties',a.uncertainties);
}
function renderRequest(){document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',b.dataset.stage===stage));const available=D.requests.map((r,i)=>({r,i})).filter(x=>x.r.stage===stage&&x.r.frame<=fi);if(requestIndex===null||!available.some(x=>x.i===requestIndex))requestIndex=available.at(-1)?.i??null;
 $('request-picker').innerHTML=available.length?available.map(({r,i})=>`<option value="${i}">${r.id} · F${r.frame} · ${fmt(r.latency_seconds,1)} s</option>`).join(''):`<option>${t('none')}</option>`;$('request-picker').disabled=!available.length;$('request-empty').classList.toggle('hidden',!!available.length);$('request-content').classList.toggle('hidden',!available.length);$('request-empty').textContent=t('noReview');$('request-meta').textContent=`${available.length} / ${D.requests.filter(r=>r.stage===stage).length}`;if(requestIndex===null)return;
 $('request-picker').value=requestIndex;const c=D.requests[requestIndex];$('answer').innerHTML=answerHTML(c);const m=c.metadata;
 $('request-context').textContent=c.stage==='jev'?`${t('jev')} · F${c.frame} · ${c.images.map(x=>'F'+x.frame).join(' → ')}`:c.stage==='dedup'?`${m.previous_id} (F${m.A.index}) → ${m.current_id} (F${m.B.index}) · ${t('confirmFrame')}: F${c.frame} · ${lang==='zh'?'仅全部实际分支一一对应才替换旧点；否则保留两点。':'Replace the old node only when every physical branch corresponds; otherwise keep both.'}`:`${m.previous_id} (F${m.previous_frame}) → ${m.current_id} (F${m.current_frame}) · ${t(m.mode)} · ${lang==='zh'?'仅端点及最多5张均匀中间图；不使用B之后的画面。':'Endpoints plus up to five uniformly sampled intermediate frames; no images after B.'}`;
 $('input-images').innerHTML=c.images.map((im,i)=>`<button data-image="${im.image}" data-caption="${esc(im.label)}" title="SHA256: ${im.sha256}"><img src="${D.images[im.image]}" alt="F${im.frame}"><span>${esc(im.label.replace('; actual frame','; '+(lang==='zh'?'实际帧':'actual frame')))}</span></button>`).join('');
 const p=D.prompts[stage][lang];$('prompt').textContent=stage==='jev'?`${t('context')}\n${p.context}\n\n${t('instructions')}\n${p.instructions}\n\n${t('criterionTrue')}\n${p.criteria.true}\n\n${t('criterionFalse')}\n${p.criteria.false}`:p;$('prompt-note').textContent=t((stage==='jev'?lang==='en':lang==='zh')?'promptOriginal':'promptTranslated');$('raw-request').textContent=JSON.stringify(c.raw_request,null,2);$('raw-answer').textContent=JSON.stringify(c.raw_answer,null,2);$('request-source').textContent=c.source;
}
function noteKey(){return `serial-review:${D.run}:${D.id}:${fi}`}
function loadNote(){let value='';try{value=localStorage.getItem(noteKey())||''}catch{}$('note').value=value;$('note-status').textContent=value?t('notesSaved'):t('noNotes')}
function setFrame(index,halt=true){if(halt)stop();fi=Math.min(D.frames.length-1,Math.max(0,index));requestIndex=null;const f=frame();$('map-timeline').value=$('rgb-timeline').value=fi;$('rgb').src=D.images[f.image];$('map-time').textContent=$('rgb-time').textContent=`F${fi} / F${D.frames.length-1}`;$('action').textContent=action(f.action);$('rgb-note').textContent=t(fi===D.frames.length-1?'lastFrameNote':'frameNote');$('frame-summary').textContent=`F${fi} · ${t('position')} (${f.position.map(x=>fmt(x,3)).join(', ')}) · ${f.physics_ticks} ${t('ticks')} · JEV ${fmt(f.probability,2)} · ${action(f.action)}`;drawMap();drawChart();renderNodes();renderRequest();loadNote()}
function chooseNode(id){const n=D.nodes.find(n=>n.id===id);stage='deviation';setFrame(n.emittedAt);requestIndex=n.deviation_request;renderRequest()}
function language(value){const saved=requestIndex;lang=value;$('language').value=value;renderStatic();setFrame(fi);requestIndex=saved;renderRequest()}
function zoom(factor){const [x,y,w,h]=view,nw=w/factor,nh=h/factor;view=[x+(w-nw)/2,y+(h-nh)/2,nw,nh];drawMap()}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
$('language').onchange=e=>language(e.target.value);$('map-timeline').oninput=$('rgb-timeline').oninput=e=>setFrame(Number(e.target.value));$('start').onclick=()=>setFrame(0);$('end').onclick=()=>setFrame(D.frames.length-1);$('prev').onclick=()=>setFrame(fi-1);$('next').onclick=()=>setFrame(fi+1);$('play').onclick=play;$('show-all').onchange=()=>{drawMap();renderNodes()};$('zoom-in').onclick=()=>zoom(1.3);$('zoom-out').onclick=()=>zoom(1/1.3);$('fit').onclick=()=>{view=null;drawMap()};$('rgb').onclick=()=>showImage(frame().image,`F${fi} · ${action(frame().action)}`);$('close').onclick=()=>$('dialog').close();
$('legend').onchange=e=>{if(e.target.dataset.layer){layers[e.target.dataset.layer]=e.target.checked;drawMap()}};$('node-table').onclick=e=>{const row=e.target.closest('[data-node]');if(row)chooseNode(row.dataset.node)};
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;requestIndex=null;renderRequest()});$('request-picker').onchange=e=>{requestIndex=Number(e.target.value);renderRequest()};$('input-images').onclick=e=>{const b=e.target.closest('[data-image]');if(b)showImage(Number(b.dataset.image),b.dataset.caption.replace('; actual frame','; '+(lang==='zh'?'实际帧':'actual frame')))};
$('note').oninput=()=>{try{localStorage.setItem(noteKey(),$('note').value);$('note-status').textContent=t('notesSaved')}catch(e){$('note-status').textContent=lang==='zh'?'浏览器存储不可用，请导出当前意见。':'Browser storage is unavailable; export the current note.'}};
$('export-notes').onclick=()=>{const notes=[];for(let i=0;i<D.frames.length;i++){let text='';try{text=localStorage.getItem(`serial-review:${D.run}:${D.id}:${i}`)||''}catch{}if(i===fi)text=$('note').value;if(text)notes.push({frame:i,note:text})}download(D.run+'_notes.json',JSON.stringify({episode_id:D.id,run:D.run,exported_at:new Date().toISOString(),notes},null,2),'application/json')};
$('export-csv').onclick=()=>{const header='frame,physics_ticks,x,y,z,action_code,jev_probability,confirmed_nodes';const lines=D.frames.map(f=>[f.index,f.physics_ticks,...f.position,f.action,f.probability,D.nodes.filter(n=>n.emittedAt===f.index).map(n=>n.id).join('|')].join(','));download(D.run+'_frames.csv',[header,...lines].join('\n'),'text/csv;charset=utf-8')};
$('export-json').onclick=()=>download(D.run+'_summary.json',JSON.stringify({run:D.run,episode_id:D.id,summary:D.summary,metrics:D.metrics,nodes:D.nodes},null,2),'application/json');
$('map').onpointerdown=e=>{const n=e.target.closest('[data-node]');if(n){chooseNode(n.dataset.node);return}drag={x:e.clientX,y:e.clientY,view:view.slice(),scale:Math.min($('map').clientWidth/view[2],$('map').clientHeight/view[3])};$('map').setPointerCapture(e.pointerId)};$('map').onpointermove=e=>{if(!drag)return;view=drag.view.slice();view[0]-=(e.clientX-drag.x)/drag.scale;view[1]-=(e.clientY-drag.y)/drag.scale;drawMap()};$('map').onpointerup=$('map').onpointercancel=()=>drag=null;$('map').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15)},{passive:false});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$('dialog').open)return;if(e.key==='ArrowLeft'){e.preventDefault();setFrame(fi-1)}if(e.key==='ArrowRight'){e.preventDefault();setFrame(fi+1)}if(e.code==='Space'){e.preventDefault();play()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
window.SERIAL_REPLAY={data:D,setFrame,chooseNode,language,state:()=>({frame:fi,stage,requestIndex,lang,playing,nodes:nodeState()})};language('zh');
</script></body></html>
