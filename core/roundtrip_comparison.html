<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>回退轨迹对照 · RxR-CE / H1</title>
<style>
@font-face{font-family:Replay;src:url(replay.ttf) format("truetype");font-display:swap}
:root{color-scheme:light;--text:#173830;--muted:#52675f;--edge:#c9d6cd;--paper:#f0f4ef;--turn:#a44922;--back:#126a61;--out:#355e99;--reset:#8559a0;font-family:Inter,"Microsoft YaHei","Noto Sans CJK SC",Replay,sans-serif;color:var(--text);background:var(--paper);font-variant-numeric:tabular-nums}
*{box-sizing:border-box}body{margin:0}header{background:#16392f;color:white}header>div,main{max-width:1540px;margin:auto;padding:17px clamp(12px,2.6vw,42px)}header>div,.bar,.tools,.legend,.range,.transport,.modes,.summary,.group,.titlebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header>div,.bar,.titlebar{justify-content:space-between}.titlebar{align-items:baseline}header h1{font-size:clamp(21px,2vw,30px);letter-spacing:.015em;margin:0}main{display:grid;gap:13px;padding-bottom:32px}h2,h3,p,figure{margin:0}h2{font-size:17px}h3{font-size:14px}.panel{border:1px solid var(--edge);background:#fff;border-radius:10px;min-width:0;overflow:hidden}.pad{padding:13px 15px}.bar{gap:14px}.group label{font-size:13px;color:var(--muted)}.group select{margin-left:4px}button,select{border:1px solid #aebeaf;background:white;color:var(--text);border-radius:6px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}button:hover,select:hover{background:#f1f5f0}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true],#play{background:#205e4a;color:white;border-color:#205e4a}select:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ca9b40;outline-offset:2px}header select{font-size:13px}input{accent-color:#21664e}.modes{gap:5px}.summary,.minor,.caption,.range,.legend,.tools,.transport{font-size:13px}.summary,.minor,.caption{color:var(--muted);line-height:1.5}.minor{font-size:12px}.summary strong,.metric{color:var(--text);font-weight:650}#instruction{margin-top:9px;font-size:14px;border-left:3px solid #8ba99c;padding-left:10px}.twocol{display:grid;grid-template-columns:minmax(310px,.94fr) minmax(400px,1.3fr);gap:13px;align-items:start}.panelhead{padding:11px 14px;border-bottom:1px solid var(--edge)}.mapwrap{background:#eaf0e9}#map{display:block;width:100%;height:clamp(290px,27vw,435px);touch-action:none;cursor:grab}#map:active{cursor:grabbing}.tools,.legend{padding:8px 13px;gap:5px 12px}.tools{border-block:1px solid var(--edge);justify-content:space-between}.tools label,.legend label{display:inline-flex;align-items:center;gap:4px}.tools button,.transport button{padding:4px 9px}.tools input{width:80px}.legend label{cursor:pointer}.swatch{width:14px;border-top:3px solid var(--c)}.range{padding:8px 13px;gap:8px;flex-wrap:nowrap}.range input{flex:1;min-width:25px}.range output{min-width:54px;text-align:right}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.pictures.single{grid-template-columns:minmax(0,560px);justify-content:center}.pictures figure{min-width:0}.pictures h3{border-left:4px solid var(--c);padding-left:7px;margin:2px 0 6px}.pictures img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#1b2822;border-radius:4px}.caption{margin:5px 0;font-size:12px}.alert{color:#8b461b}.transport{padding:2px 13px 11px}.foot{display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(220px,.9fr);gap:18px}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:5px}td,th{border-bottom:1px solid #e0e8e0;padding:5px;text-align:right}td:first-child,th:first-child{text-align:left}.fail{color:#a44922}.pass{color:#126a61}.foot p{margin-top:6px}.status{min-height:1em}#error{color:#a44922}[hidden]{display:none!important}
@media(max-width:940px){.twocol{grid-template-columns:1fr 1fr}.pictures{grid-template-columns:1fr}.pictures figure{display:grid;grid-template-columns:minmax(95px,1.5fr) 1fr;align-items:start;gap:3px 8px}.pictures h3{grid-column:1/-1}.pictures.single figure{display:block}}
@media(max-width:710px){.twocol,.foot{grid-template-columns:1fr}.pictures{grid-template-columns:1fr 1fr}.pictures figure{display:block}#map{height:320px}.group{gap:6px}.bar{align-items:flex-start}.pad,.panelhead{padding:10px}.tools,.legend{padding:7px}.summary{font-size:12px}.group select{max-width:80vw}}
</style></head><body>
<header><div><h1 data-en="Rollback trajectory comparison">回退轨迹对照</h1><select id="lang" aria-label="中文 / English"><option value="zh">中文</option><option value="en">English</option></select></div></header>
<main>
<section class="panel pad"><div class="bar"><div class="group"><label><span data-en="Experiment">实验</span><select id="dataset"><option value="rxr">RxR-CE · Habitat</option><option value="h1">VLNVerse · H1</option></select></label><label><span data-en="Case">案例</span><select id="cases"></select></label></div><div class="summary" id="summary"></div></div>
<p id="instruction" hidden></p><div class="bar" style="margin-top:11px"><nav class="modes" id="modes"></nav><p class="minor" id="identity"></p></div><p id="error" role="alert"></p></section>
<div class="twocol"><section class="panel"><div class="panelhead titlebar"><h2 data-en="Floor plan">俯视地图</h2><span class="minor" id="distance"></span></div>
<div class="mapwrap"><svg id="map" viewBox="0 0 640 365" role="img" aria-label="俯视地图"><image id="mapImage" preserveAspectRatio="none"/><g id="drawing"></g></svg></div>
<div class="tools"><div><button id="minus" aria-label="−">−</button> <button id="plus" aria-label="+">+</button> <button id="fit" data-en="Fit routes">适配轨迹</button> <button id="full" data-en="Full map">完整底图</button></div><label><span data-en="Line width">线宽</span><input id="width" type="range" min="1" max="12" step=".5" value="3"><output id="widthVal">3 px</output></label></div>
<div class="legend" id="layers"></div><label class="range"><span data-en="Map frame">地图帧</span><input id="mapStep" type="range" min="0" value="0"><output></output></label></section>
<section class="panel"><div class="panelhead titlebar"><h2 data-en="First-person RGB">第一人称 RGB</h2><span class="minor" id="source"></span></div>
<div id="pictures" class="pictures"></div><label class="range"><span data-en="RGB frame">观测帧</span><input type="range" id="rgbStep" min="0" value="0"><output></output></label>
<div class="transport"><button id="start" data-en="Start">起点</button><button id="prev" data-en="Previous">上一步</button><button id="play">播放</button><button id="next" data-en="Next">下一步</button><button id="end" data-en="Endpoint">终点</button></div></section></div>
<section class="panel pad foot"><div><h2 data-en="Return to A">返回 A 的结果</h2><table><thead><tr><th data-en="Method">方式</th><th data-en="Horizontal error">水平误差</th><th data-en="Heading error">朝向误差</th><th data-en="Outcome">结果</th></tr></thead><tbody id="metrics"></tbody></table></div><div><h2 data-en="Reading the replay">回放说明</h2><p class="caption" id="explanation"></p><p class="caption" id="criterion"></p><p class="caption" data-en="Navigation SR and mean SPL: no scored episodes in either group.">整条导航的 SR 与平均 SPL：两组均暂无，已评分 0 条。</p></div></section>
</main><script src="catalog.js"></script><script src="player.js"></script></body></html>
