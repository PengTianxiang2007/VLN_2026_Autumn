<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逆动作回退回放</title>
<style>
@font-face{font-family:Replay;src:url("__FONT__") format("truetype");font-display:swap}
:root{color-scheme:light;--ink:#172e31;--muted:#50686b;--rule:#c9d8d3;--ground:#eef3f1;--inv:#b24f22;--hist:#21648d;--reset:#17745c;font-family:Inter,"Microsoft YaHei","Noto Sans CJK SC",Replay,sans-serif;color:var(--ink);background:var(--ground)}
*{box-sizing:border-box}body{margin:0}header{background:#183c3a;color:white;padding:20px max(20px,calc((100vw - 1440px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:clamp(22px,2.3vw,32px);margin:0}h2{font-size:17px;margin:0}header select{max-width:125px}main{max-width:1480px;margin:auto;padding:18px 20px 32px}.stack{display:grid;gap:14px}.card{background:#fff;border:1px solid var(--rule);border-radius:10px;min-width:0;overflow:hidden}.head,.inside{padding:13px 16px}.head,.controls,.metadata,.slider,.legend,.tools,.modes,.links{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.head{justify-content:space-between;border-bottom:1px solid var(--rule)}.controls{justify-content:space-between}.meta,.caption,.metadata,.guide,small{color:var(--muted);font-size:13px;line-height:1.55}.caption{margin:9px 0}.taskrow{display:flex;align-items:center;gap:9px;font-weight:600;max-width:100%}select,button{font:inherit;color:var(--ink);border:1px solid #adbfba;background:white;border-radius:6px;padding:6px 10px;cursor:pointer}button:hover{background:#eef5f1}button:disabled{opacity:.45;cursor:default}select{max-width:100%}input[type=checkbox],input[type=range]{accent-color:#146b59}input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c98135;outline-offset:2px}.modes button[aria-pressed=true],#play{background:#185b4e;border-color:#185b4e;color:white}.modes button{font-size:14px}.summary{display:flex;gap:15px;flex-wrap:wrap}.summary span{white-space:nowrap}.summary b{font-size:16px;color:var(--ink)}.instruction{border-left:3px solid #3d8e77;padding:8px 12px;margin:9px 0 0;background:#f0f6f3;line-height:1.55;font-size:14px}
.panels{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);gap:14px;align-items:start}.views{display:grid;gap:12px}.mapbox{position:relative;background:#edf1ef}#map{width:100%;height:clamp(300px,30vw,480px);touch-action:none;display:block;cursor:grab}#map:active{cursor:grabbing}.legend label{display:inline-flex;align-items:center;gap:3px;cursor:pointer;font-size:13px}.sample{width:17px;border-top:3px solid;display:inline-block}.tools label{font-size:13px;display:inline-flex;align-items:center;gap:4px}#width{width:92px}.tools{justify-content:space-between;border-top:1px solid var(--rule);padding:10px 14px}.slider{font-size:13px;flex-wrap:nowrap}.slider input{flex:1;min-width:40px}.slider output{font-variant-numeric:tabular-nums;min-width:4em;text-align:right}.visual{background:#182321;display:grid;place-items:center}.visual img{display:block;width:100%;height:clamp(268px,26vw,420px);object-fit:contain}.source{background:#f3f7f4;border-radius:5px;padding:3px 8px;font-size:12px;color:#385650}.tabular,td,output{font-variant-numeric:tabular-nums}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px}table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}th,td{padding:8px 6px;border-bottom:1px solid #e1eae6}th{font-weight:600}td:last-child{text-align:right}.pass{color:var(--reset)}.fail{color:#963d1b}#links button{font-size:13px}.guide{margin:4px 0}.figureinfo{flex:1}.transport{display:flex;align-items:center;gap:7px;margin:9px 0 2px;flex-wrap:wrap}#sourceNote{margin:0}.current{display:flex;gap:8px 18px;flex-wrap:wrap}.current strong{font-variant-numeric:tabular-nums}summary{cursor:pointer;font-size:14px;font-weight:600}
@media(max-width:820px){main{padding:12px}.panels,.details{grid-template-columns:1fr}header{padding:13px 16px}#map{height:335px}.visual img{height:min(65vw,400px)}.taskrow{flex-wrap:wrap}.taskrow select{width:100%;font-size:13px}.controls{gap:10px}.head,.inside{padding:10px 12px}.modes{gap:5px}.modes button{padding:6px 8px}.source{max-width:65%}}
</style></head><body>
<header><h1 data-en="Inverse-action rollback replay">逆动作回退回放</h1><select id="lang" aria-label="中文 / English"><option value="zh">中文</option><option value="en">English</option></select></header>
<main class="stack">
<section class="card inside"><div class="controls"><label class="taskrow"><span data-en="Case">案例</span><select id="cases"></select></label><div id="summary" class="summary meta"></div></div>
<p id="instruction" class="instruction"></p><div class="controls" style="margin-top:12px"><div id="modes" class="modes"></div><div id="ident" class="metadata"></div></div></section>
<div class="panels">
<section class="card"><div class="head"><h2 data-en="Floor plan">俯视地图</h2><div id="locations" class="meta"></div></div>
<div class="mapbox"><svg id="map" viewBox="0 0 720 412" role="img" aria-label="俯视地图"></svg></div>
<div class="tools"><div class="links"><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">+</button><button id="fit" data-en="Fit routes">适配轨迹</button><button id="full" data-en="Full map">完整底图</button></div>
<label><span data-en="Line width">线宽</span><input id="width" type="range" min="1" max="12" step=".5" value="3"><output id="widthVal">3 px</output></label></div>
<div class="inside stack" style="padding-top:2px"><div class="legend" id="layers"></div>
<label class="slider"><span data-en="Map frame">地图帧</span><input type="range" id="mapStep" min="0" value="0"><output></output></label>
<p class="guide" data-en="A marks the target, B the alarm, ◆ the inverse endpoint, and + the reset endpoint. Use the wheel or pinch to zoom. Drag to pan.">A 为目标，B 为报警点，◆ 为逆动作落点，+ 为 reset 落点。滚轮或双指缩放，拖动可平移。</p></div></section>
<section class="card"><div class="head"><h2 data-en="First-person view">第一人称观测</h2><span class="source" id="source"></span></div>
<div class="visual" style="min-height:clamp(268px,26vw,420px)"><img id="rgb" alt="第一人称观测"><span hidden id="missing" style="color:white" data-en="First-person RGB was not saved during rollback.">回退阶段未保存第一人称画面</span></div><div class="inside"><label class="slider"><span data-en="Replay frame">回放帧</span><input type="range" id="rgbStep" min="0" value="0"><output></output></label>
<div class="transport"><button id="prev" data-en="Previous">上一步</button><button id="play">播放</button><button id="next" data-en="Next">下一步</button><span id="action" class="caption"></span></div>
<p id="sourceNote" class="guide"></p></div></section></div>
<div class="details"><section class="card inside"><h2 data-en="Paired endpoints">本例回退落点</h2><table><thead><tr><th data-en="Method">回退方式</th><th data-en="XY error">水平误差</th><th data-en="Heading error">朝向误差</th><th data-en="Result">结果</th></tr></thead><tbody id="results"></tbody></table>
<div id="links" class="links" style="margin-top:10px"></div></section>
<section class="card inside"><h2 data-en="Current robot pose">当前机器人位姿</h2><p id="pose" class="current"></p><div id="relative" class="meta tabular"></div><details style="margin-top:10px"><summary data-en="Scoring and observations">达标标准与观测来源</summary>
<p class="guide" data-en="A return passes when the robot remains operational within 0.35 m horizontally and 15° of the target heading. Endpoints include physical failures. No episode-level navigation SR or SPL was scored.">机器人须保持可行动，距目标水平位置不超过 0.35 米，朝向误差不超过 15°。统计包含物理失败。本次未评整条导航的 SR 或 SPL。</p>
<p class="guide" id="observations"></p></details></section></div>
</main><script id="data" type="application/json">/*__DATA__*/</script><script>/*__PLAYER__*/</script><!--__FONT_LICENSE__--></body></html>
